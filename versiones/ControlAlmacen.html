    <style>
:root {
  --fondo: #f4f6f9;
  --superficie: #ffffff;
  --superficie-2: #f8fafc;
  --borde: #dde3ea;
  --texto: #1c2733;
  --texto-suave: #5b6b7c;
  --primario: #1f4e8c;
  --primario-hover: #183f72;
  --primario-suave: #e6eef8;
  --sobre-primario: #fff; /* texto sobre fondos del color principal */
  --sobre-intenso: #fff; /* texto sobre fondos rojo, verde o ámbar */
  --ok: #1d7a46;
  --ok-suave: #e5f4ea;
  --alerta: #a15c00;
  --alerta-suave: #fff4e0;
  --error: #b42318;
  --error-suave: #fdecea;
  --neutro-suave: #eef1f5;
  --vale-cabecera: #fff1a8;
  --vale-descripcion: #fbd3b0;
  --vale-cabecera-texto: #3d3200;
  --sombra: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  --radio: 8px;
  --fuente: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  --dur-corta: 0.15s;
  --dur-media: 0.22s;
  color-scheme: light;
}

/* Oscuro: por elección (Ajustes → Personalización) o como Windows si no eligió claro. */
@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) {
    --fondo: #0f1620;
    --superficie: #17212d;
    --superficie-2: #1c2836;
    --borde: #2c3a4b;
    --texto: #e3e9f0;
    --texto-suave: #9aabbd;
    --primario: #6ea3e8;
    --primario-hover: #8bb7f0;
    --primario-suave: #1d3150;
    --sobre-primario: #0b1a2e;
    --sobre-intenso: #12161c;
    --ok: #5cc98a;
    --ok-suave: #173526;
    --alerta: #f0b35a;
    --alerta-suave: #3a2c14;
    --error: #f27b70;
    --error-suave: #3d1d1b;
    --neutro-suave: #243243;
    --vale-cabecera: #4a4315;
    --vale-descripcion: #57391f;
    --vale-cabecera-texto: #fff4c2;
    color-scheme: dark;
  }
}

:root[data-tema="oscuro"] {
  --fondo: #0f1620;
  --superficie: #17212d;
  --superficie-2: #1c2836;
  --borde: #2c3a4b;
  --texto: #e3e9f0;
  --texto-suave: #9aabbd;
  --primario: #6ea3e8;
  --primario-hover: #8bb7f0;
  --primario-suave: #1d3150;
  --sobre-primario: #0b1a2e;
  --sobre-intenso: #12161c;
  --ok: #5cc98a;
  --ok-suave: #173526;
  --alerta: #f0b35a;
  --alerta-suave: #3a2c14;
  --error: #f27b70;
  --error-suave: #3d1d1b;
  --neutro-suave: #243243;
  --vale-cabecera: #4a4315;
  --vale-descripcion: #57391f;
  --vale-cabecera-texto: #fff4c2;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: var(--fuente);
  font-size: 15px;
  line-height: 1.45;
}

a {
  color: var(--primario);
}

code {
  font-family: var(--mono);
  font-size: 0.9em;
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: 4px;
  padding: 0 4px;
}

h1 {
  font-size: 1.5rem;
  margin: 0 0 16px;
}

h2 {
  font-size: 1.1rem;
  margin: 0;
}

h3 {
  font-size: 1rem;
  margin: 20px 0 8px;
}

/* ---------------------------------------------------------------- inventario (DLTA / GSM, rondas 17 y 18)
   Cada inventario con su color en toda la interfaz (botones, enlaces, menú, pestañas, foco) además de la
   franja de la cabecera, el logo y el selector: así siempre se sabe en cuál estás. DLTA conserva el azul
   de siempre; en GSM el color principal es morado. */

:root {
  --inventario: var(--primario);
  --inventario-suave: var(--primario-suave);
  --sobre-inventario: var(--sobre-primario);
}

:root[data-inventario="GSM"] {
  --primario: #6b3fa0;
  --primario-hover: #573285;
  --primario-suave: #f1eafa;
  --sobre-primario: #fff;
  --inventario: #6b3fa0;
  --inventario-suave: #f1eafa;
  --sobre-inventario: #fff;
}

@media (prefers-color-scheme: dark) {
  :root[data-inventario="GSM"]:not([data-tema="claro"]) {
    --primario: #b99df0;
    --primario-hover: #cbb6f5;
    --primario-suave: #2c2240;
    --sobre-primario: #1a1030;
    --inventario: #b99df0;
    --inventario-suave: #2c2240;
    --sobre-inventario: #1a1030;
  }
}

:root[data-inventario="GSM"][data-tema="oscuro"] {
  --primario: #b99df0;
  --primario-hover: #cbb6f5;
  --primario-suave: #2c2240;
  --sobre-primario: #1a1030;
  --inventario: #b99df0;
  --inventario-suave: #2c2240;
  --sobre-inventario: #1a1030;
}

/* ---------------------------------------------------------------- marco */

.cabecera {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 10px 20px;
  background: var(--superficie);
  border-bottom: 1px solid var(--borde);
  box-shadow: inset 0 3px 0 var(--inventario);
}

.cabecera-izquierda {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  min-width: 0;
}

.selector-inventario {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 3px;
  border: 1px solid var(--borde);
  border-radius: 10px;
  background: var(--superficie-2);
}

.selector-inventario-etiqueta {
  padding: 0 6px 0 5px;
  color: var(--texto-suave);
  font-size: 0.75rem;
}

.inventario-opcion {
  padding: 4px 12px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--texto-suave);
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  cursor: pointer;
  transition: background var(--dur-corta) ease, color var(--dur-corta) ease;
}

.inventario-opcion:hover {
  background: var(--neutro-suave);
  color: var(--texto);
}

.inventario-opcion.activo {
  background: var(--inventario);
  color: var(--sobre-inventario);
  cursor: default;
}

.marca {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--texto);
  text-decoration: none;
}

.marca strong {
  display: block;
  font-size: 1.05rem;
}

.marca small {
  display: block;
  color: var(--texto-suave);
  font-size: 0.8rem;
}

.logo {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 8px;
  background: var(--inventario);
  color: var(--sobre-inventario);
  font-size: 20px;
}

.cabecera-derecha {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.usuario {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

.estado-guardado {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  color: var(--texto-suave);
  text-decoration: none;
  padding: 4px 10px;
  border-radius: 999px;
  border: 1px solid var(--borde);
}

.estado-guardado .punto {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--ok);
}

.estado-alerta .punto {
  background: var(--alerta);
}

.banner {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  padding: 8px 20px;
  background: var(--alerta-suave);
  border-bottom: 1px solid var(--borde);
  font-size: 0.9rem;
  flex-wrap: wrap;
}

.cuerpo {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  min-height: calc(100vh - 57px);
}

.navegacion {
  position: sticky;
  top: 57px;
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 12px;
  height: calc(100vh - 57px);
  padding: 16px 10px 12px;
  border-right: 1px solid var(--borde);
  background: var(--superficie);
}

.nav-principal {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  overflow-y: auto;
}

.navegacion a,
.nav-boton-mas {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 10px;
  border-radius: 6px;
  color: var(--texto);
  text-decoration: none;
}

.nav-texto {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.navegacion .icono {
  flex: none;
  color: var(--texto-suave);
}

.navegacion a.activo .icono {
  color: var(--primario);
}

.navegacion a:hover {
  background: var(--superficie-2);
}

.navegacion a.activo {
  background: var(--primario-suave);
  color: var(--primario);
  font-weight: 600;
}

.contador {
  min-width: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--alerta);
  color: var(--sobre-intenso);
  font-size: 0.75rem;
  font-weight: 700;
  text-align: center;
}

.contenido {
  padding: 24px 28px 64px;
  max-width: 1400px;
  width: 100%;
}

@media (max-width: 860px) {
  .cuerpo {
    grid-template-columns: 1fr;
  }

  .navegacion {
    position: static;
    height: auto;
    flex-direction: row;
    flex-wrap: wrap;
    border-right: 0;
    border-bottom: 1px solid var(--borde);
    padding: 8px 16px;
  }

  .nav-principal {
    flex-direction: row;
    flex-wrap: wrap;
  }

  .contenido {
    padding: 16px;
  }

  .cabecera {
    padding: 10px 16px;
  }

  .selector-inventario-etiqueta {
    display: none;
  }
}

/* ---------------------------------------------------------------- piezas */

.tarjeta {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 18px 20px;
  margin-bottom: 16px;
}

.tarjeta-cabeza {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.tarjeta.peligro {
  border-color: var(--error);
}

.introduccion {
  color: var(--texto-suave);
  max-width: 900px;
  margin-top: -6px;
}

.nota {
  color: var(--texto-suave);
  font-size: 0.88rem;
}

.ok {
  color: var(--ok);
  font-weight: 600;
}

.alerta {
  color: var(--alerta);
  font-weight: 600;
}

.boton {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 6px;
  border: 1px solid var(--borde);
  background: var(--superficie);
  color: var(--texto);
  font: inherit;
  font-weight: 600;
  cursor: pointer;
  text-decoration: none;
  white-space: nowrap;
  transition: background var(--dur-corta) ease, border-color var(--dur-corta) ease, color var(--dur-corta) ease, transform var(--dur-corta) ease, box-shadow var(--dur-corta) ease;
}

.boton:hover {
  background: var(--superficie-2);
}

.boton:active:not(:disabled) {
  transform: scale(0.97);
}

/* Todo lo que se puede usar con teclado muestra dónde está el foco. */
.boton:focus-visible,
button:focus-visible,
select:focus-visible,
input:focus-visible,
textarea:focus-visible,
summary:focus-visible,
a:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 2px;
}

.boton-primario {
  background: var(--primario);
  border-color: var(--primario);
  color: var(--sobre-primario);
}

.boton-primario:hover {
  background: var(--primario-hover);
}

.boton-peligro {
  background: var(--error);
  border-color: var(--error);
  color: var(--sobre-intenso);
}

.boton-chico {
  padding: 5px 10px;
  font-size: 0.88rem;
}

.boton-grande {
  padding: 12px 20px;
  font-size: 1.05rem;
}

.respaldo-reciente {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 16px 18px;
  margin: 12px 0;
  border: 2px solid var(--ok);
  border-radius: var(--radio);
  background: var(--ok-suave);
}

.respaldo-reciente > div {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.respaldo-fecha {
  font-size: 1.6rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.boton-texto {
  border-color: transparent;
  background: transparent;
  color: var(--primario);
  padding: 4px 8px;
}

.boton.deshabilitado {
  opacity: 0.5;
  pointer-events: none;
}

.acciones-linea {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin: 10px 0;
}

.aviso {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 16px;
  border-radius: var(--radio);
  border: 1px solid var(--borde);
  border-left-width: 4px;
  margin-bottom: 14px;
  background: var(--superficie);
}

.aviso ul {
  margin: 4px 0 0;
  padding-left: 20px;
}

.aviso-info {
  border-left-color: var(--primario);
  background: var(--primario-suave);
}

.aviso-exito {
  border-left-color: var(--ok);
  background: var(--ok-suave);
}

.aviso-advertencia {
  border-left-color: var(--alerta);
  background: var(--alerta-suave);
}

.aviso-error {
  border-left-color: var(--error);
  background: var(--error-suave);
}

.datos {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.dato {
  display: flex;
  flex-direction: column;
  padding: 14px 16px;
  border-radius: var(--radio);
  background: var(--superficie);
  border: 1px solid var(--borde);
  box-shadow: var(--sombra);
}

.dato-etiqueta {
  color: var(--texto-suave);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.dato-valor {
  font-size: 1.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* Datos que son nombres (detalle del vale): más chicos para que no se corten. */
.datos-texto .dato-valor {
  font-size: 1.05rem;
  overflow-wrap: anywhere;
}

.dato-detalle {
  color: var(--texto-suave);
  font-size: 0.85rem;
}

.dato-alerta .dato-valor {
  color: var(--alerta);
}

.dato-ok .dato-valor {
  color: var(--ok);
}

.insignia {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 600;
  background: var(--superficie-2);
  border: 1px solid var(--borde);
}

.lista-simple {
  margin: 6px 0;
  padding-left: 20px;
}

.lista-simple li {
  margin: 3px 0;
}

.pasos {
  margin: 0;
  padding-left: 22px;
}

.pasos li {
  margin-bottom: 12px;
}

.rejilla-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 16px;
}

.archivo {
  font-family: var(--mono);
  font-size: 0.85rem;
  word-break: break-all;
  margin: 8px 0 4px;
}

.detalles {
  margin: 10px 0;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
}

.detalles summary {
  cursor: pointer;
  padding: 10px 14px;
  font-weight: 600;
}

.detalles-cuerpo {
  padding: 0 14px 12px;
}

.faq dt {
  font-weight: 600;
  margin-top: 12px;
}

.faq dd {
  margin: 4px 0 0;
  color: var(--texto-suave);
}

/* ---------------------------------------------------------------- pasos */

.paso-numero {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  margin-right: 10px;
  border-radius: 50%;
  background: var(--primario-suave);
  color: var(--primario);
  font-size: 0.9rem;
}

.paso-listo .paso-numero {
  background: var(--ok);
  color: var(--sobre-intenso);
}

.paso-deshabilitado {
  opacity: 0.6;
}

.formulario {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.formulario label {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.formulario label span {
  font-weight: 600;
}

.formulario small {
  color: var(--texto-suave);
}

input,
select {
  font: inherit;
  color: var(--texto);
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: 6px;
  padding: 7px 10px;
}

/* ---------------------------------------------------------------- tablas */

.filtros {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  align-items: center;
  margin-bottom: 12px;
}

.buscador {
  flex: 1 1 280px;
  min-width: 220px;
}

.en-linea {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--texto-suave);
  font-size: 0.9rem;
}

.conteo {
  color: var(--texto-suave);
  font-size: 0.9rem;
  margin-left: auto;
}

.tabla-contenedor {
  overflow: auto;
  max-height: 70vh;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
}

.tabla {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.88rem;
}

.tabla th {
  position: sticky;
  top: 0;
  z-index: 1;
  background: var(--superficie-2);
  text-align: left;
  font-weight: 600;
  padding: 8px 10px;
  border-bottom: 1px solid var(--borde);
  white-space: nowrap;
}

.tabla td {
  padding: 6px 10px;
  border-bottom: 1px solid var(--borde);
  vertical-align: top;
}

.tabla tbody tr:hover {
  background: var(--superficie-2);
}

.numero {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.sin-corte {
  white-space: nowrap;
}

.fila-negativa td {
  color: var(--error);
}

.nota-icono {
  cursor: help;
  color: var(--primario);
}

.mas {
  display: flex;
  gap: 10px;
  align-items: center;
  justify-content: flex-end;
  margin-top: 8px;
  color: var(--texto-suave);
  font-size: 0.9rem;
}

.vacio {
  color: var(--texto-suave);
  font-style: italic;
}

/* ---------------------------------------------------------------- pendientes */

.pendiente {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 16px;
  padding: 14px 0;
  border-bottom: 1px solid var(--borde);
}

.pendiente:last-child {
  border-bottom: 0;
}

.pendiente-datos {
  display: flex;
  flex-direction: column;
  gap: 4px;
  align-items: flex-start;
}

.pendiente-acciones select {
  width: 100%;
}

@media (max-width: 860px) {
  .pendiente {
    grid-template-columns: 1fr;
  }
}

/* ---------------------------------------------------------------- avisos flotantes */

.avisos {
  /* Arriba a la derecha: abajo tapaban el botón "Emitir vale". */
  position: fixed;
  right: 16px;
  top: 76px;
  z-index: 70;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: min(460px, calc(100vw - 32px));
}

:root[data-avisos="abajo"] .avisos,
body:has(.barra-entrada) .avisos,
body.con-ventana .avisos {
  top: auto;
  bottom: 16px;
  flex-direction: column-reverse;
}

.toast {
  animation: toast-arriba var(--dur-media) cubic-bezier(0.2, 0.8, 0.2, 1);
  display: flex;
  gap: 12px;
  align-items: flex-start;
  justify-content: space-between;
  padding: 12px 14px;
  border-radius: var(--radio);
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-left: 4px solid var(--primario);
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
  word-break: break-word;
}

.toast-exito {
  border-left-color: var(--ok);
}

.toast-advertencia {
  border-left-color: var(--alerta);
}

.toast-error {
  border-left-color: var(--error);
}

.cerrar {
  border: 0;
  background: transparent;
  color: var(--texto-suave);
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
}

.ocupado {
  position: fixed;
  inset: 0;
  z-index: 80;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  background: rgba(15, 22, 32, 0.35);
  color: #fff;
  font-weight: 600;
  font-size: 1.05rem;
}

.giro {
  width: 26px;
  height: 26px;
  border: 3px solid rgba(255, 255, 255, 0.4);
  border-top-color: #fff;
  border-radius: 50%;
  animation: girar 0.8s linear infinite;
}

@keyframes girar {
  to {
    transform: rotate(360deg);
  }
}

.pantalla-mensaje {
  display: grid;
  place-items: center;
  min-height: 100vh;
  padding: 16px;
}

.pantalla-mensaje .tarjeta {
  max-width: 560px;
}

.cargando {
  display: grid;
  place-items: center;
  min-height: 100vh;
  color: var(--texto-suave);
}

/* ---------------------------------------------------------------- vales (Fase 2) */

.pestanas {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.pestana {
  padding: 8px 14px;
  border: 1px solid var(--borde);
  border-radius: 8px 8px 0 0;
  background: var(--superficie-2);
  color: var(--texto);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-corta) ease, color var(--dur-corta) ease;
}

.pestana.activa {
  background: var(--superficie);
  border-bottom-color: var(--superficie);
  font-weight: 700;
  color: var(--primario);
}

.pestana.nueva {
  border-style: dashed;
  color: var(--primario);
  font-weight: 600;
}

.editor-encabezado {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 10px 14px;
  margin-bottom: 16px;
}

.campo {
  display: flex;
  flex-direction: column;
  gap: 3px;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

.campo > span {
  font-weight: 600;
}

.campo input,
.campo select,
.campo textarea {
  font-size: 0.95rem;
  color: var(--texto);
}

.campo textarea {
  font: inherit;
  border: 1px solid var(--borde);
  border-radius: 6px;
  padding: 7px 10px;
  background: var(--superficie);
  resize: vertical;
}

.campo-2 {
  grid-column: span 2;
}

.campo-todo {
  grid-column: 1 / -1;
}

.campo-casilla {
  flex-direction: row;
  align-items: center;
  gap: 8px;
  align-self: end;
  padding-bottom: 8px;
}

.con-error input,
.con-error select,
input.con-error,
select.con-error {
  border-color: var(--error);
  box-shadow: 0 0 0 1px var(--error);
}

.con-error > span {
  color: var(--error);
}

.buscador-articulos {
  position: relative;
  margin-bottom: 12px;
}

.buscador-articulos .buscador {
  width: 100%;
  font-size: 1rem;
  padding: 10px 12px;
}

.resultados {
  position: absolute;
  z-index: 15;
  top: 100%;
  left: 0;
  right: 0;
  margin: 4px 0 0;
  padding: 4px 0;
  list-style: none;
  max-height: 360px;
  overflow: auto;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  animation: desplegar var(--dur-corta) ease-out;
  transform-origin: top;
}

.resultados li {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: baseline;
  padding: 7px 12px;
  cursor: pointer;
}

.resultados li.marcado,
.resultados li:hover {
  background: var(--primario-suave);
}

.res-detalle {
  color: var(--texto-suave);
  font-size: 0.88rem;
}

.res-lugar {
  margin-left: auto;
  font-size: 0.85rem;
  font-weight: 600;
  color: var(--ok);
}

.res-lugar.sin-existencia {
  color: var(--error);
}

.res-lugar.no-inv {
  color: var(--texto-suave);
  font-weight: 400;
}

.resultados li.manual {
  border-top: 1px solid var(--borde);
  color: var(--primario);
  font-weight: 600;
}

.editor-lineas input,
.editor-lineas select {
  width: 100%;
  padding: 5px 7px;
  font-size: 0.9rem;
}

.editor-lineas td {
  vertical-align: middle;
}

.editor-lineas td.articulo {
  min-width: 220px;
}

.entrada-cantidad {
  width: 80px !important;
  text-align: right;
}

.entrada-um,
.entrada-oc {
  width: 72px !important;
}

.entrada-lote {
  width: 96px !important;
}

.entrada-clave {
  min-width: 110px;
}

.entrada-descripcion {
  margin-top: 4px;
}

.entrada-justificacion {
  width: min(460px, 100%) !important;
  margin-left: 6px;
}

.editor-lineas select {
  min-width: 190px;
}

.fila-error td {
  background: var(--error-suave);
}

.fila-aviso td {
  background: var(--alerta-suave);
  font-size: 0.88rem;
}

.quitar {
  border: 0;
  background: transparent;
  color: var(--error);
  font-size: 1.3rem;
  line-height: 1;
  cursor: pointer;
  padding: 2px 6px;
}

.pie-editor {
  border-top: 1px solid var(--borde);
  padding-top: 12px;
  margin-top: 16px;
}

.espaciador {
  flex: 1;
}

.boton-peligro-texto {
  border-color: transparent;
  background: transparent;
  color: var(--error);
}

.boton[disabled] {
  opacity: 0.5;
  cursor: not-allowed;
}

.tarjeta-exito {
  border: 2px solid var(--ok);
  background: var(--ok-suave);
}

.tarjeta-correccion {
  border: 2px solid var(--primario);
}

.motivo {
  margin-top: 14px;
}

.cabeza-vale {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}

.cabeza-vale > div:first-child {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.folio-grande {
  font-size: 1.6rem;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}

.insignia-ok {
  background: var(--ok-suave);
  color: var(--ok);
  border-color: var(--ok);
}

.insignia-error {
  background: var(--error-suave);
  color: var(--error);
  border-color: var(--error);
}

.bitacora {
  margin: 0;
  padding-left: 20px;
}

.bitacora li {
  margin-bottom: 8px;
}

.preformateado {
  white-space: pre-wrap;
}

.fila-cancelada td {
  color: var(--texto-suave);
  text-decoration: line-through;
}

.fila-cancelada td:first-child {
  text-decoration: none;
}

.fila-inactiva td {
  color: var(--texto-suave);
}

.enlace-folio {
  font-weight: 700;
}

.contador-suave {
  background: var(--primario);
}

.entrada-tabla {
  width: 100%;
  padding: 4px 6px;
}

.acciones-inicio {
  margin: 0 0 16px;
}

/* ---------------------------------------------------------------- vista previa e impresión */

.lote-folios {
  overflow-wrap: anywhere;
}

.vista-previa {
  position: fixed;
  inset: 0;
  z-index: 45;
  display: flex;
  flex-direction: column;
  background: rgba(15, 22, 32, 0.75);
}

.vista-barra {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 10px 18px;
  background: var(--superficie);
  border-bottom: 1px solid var(--borde);
}

.vista-hojas {
  flex: 1;
  overflow: auto;
  padding: 20px;
}

.vista-hojas .vale-pagina {
  width: 8.5in;
  max-width: 100%;
  box-sizing: content-box;
  padding: 0.6in 0.4in;
  margin: 0 auto 20px;
  background: #fff;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
}

#area-impresion {
  display: none;
}

@media print {
  body.imprimiendo > :not(#area-impresion) {
    display: none !important;
  }

  body.imprimiendo #area-impresion {
    display: block;
  }

  html,
  body {
    background: #fff !important;
  }
}

/* ---------------------------------------------------------------- editor del vale (datos a la izquierda, partidas al centro) */

.barra-borrador {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 10px;
}

.editor-vale {
  display: grid;
  grid-template-columns: 300px minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}

.vale-datos,
.vale-partidas,
.vale-fotos,
.vale-pie {
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: var(--sombra);
  padding: 14px 16px;
}

.vale-datos {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.vale-datos .campo input,
.vale-datos .campo select,
.vale-datos .campo textarea {
  width: 100%;
}

.ayuda {
  font-weight: 400;
  font-size: 0.78rem;
  color: var(--texto-suave);
}

.rejilla-campos {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.datos-fijos {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 10px;
  margin: 0;
  padding: 8px 12px;
  border: 1px dashed var(--borde);
  border-radius: 6px;
  background: var(--superficie-2);
  font-size: 0.88rem;
}

.datos-fijos dt {
  color: var(--texto-suave);
  font-weight: 600;
}

.datos-fijos dd {
  margin: 0;
  font-weight: 600;
}

.datos-fijos-error {
  border-color: var(--alerta);
  background: var(--alerta-suave);
}

.observaciones-fijas {
  margin: 0;
  padding: 8px 10px;
  border: 1px dashed var(--borde);
  border-radius: 6px;
  background: var(--superficie-2);
  color: var(--texto);
  font-size: 0.8rem;
  font-weight: 400;
  white-space: pre-wrap;
}

.partidas-cabeza {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 6px 12px;
  margin-bottom: 10px;
}

.partidas-cabeza h2 {
  margin: 0;
  font-size: 1.1rem;
}

.contador-partidas {
  padding: 1px 10px;
  border-radius: 999px;
  background: var(--primario-suave);
  color: var(--primario);
  font-weight: 700;
  font-size: 0.85rem;
}

.contador-partidas.excedido {
  background: var(--alerta-suave);
  color: var(--alerta);
}

.tabla-partidas {
  overflow: visible;
  max-height: none;
  margin-bottom: 10px;
}

.tabla-partidas table {
  table-layout: fixed;
}

.tabla-partidas .c-num { width: 30px; }
.tabla-partidas .c-oc { width: 62px; }
.tabla-partidas .c-cant { width: 74px; }
.tabla-partidas .c-cod { width: 82px; }
.tabla-partidas .c-clave { width: 164px; }
.tabla-partidas .c-um { width: 62px; }
.tabla-partidas .c-lote { width: 64px; }
.tabla-partidas .c-quitar { width: 78px; }

.tabla-partidas th {
  position: static;
  padding: 7px 6px;
  white-space: normal;
  line-height: 1.2;
  vertical-align: bottom;
}

.tabla-partidas .cabecera-vale th {
  font-size: 0.72rem;
  letter-spacing: 0;
}

.datos-fijos dd small {
  display: block;
  font-weight: 400;
  color: var(--texto-suave);
}

.tabla-partidas td {
  vertical-align: top;
  padding: 6px 6px;
}

.tabla-partidas td.numero:first-child {
  padding-top: 12px;
  color: var(--texto-suave);
}

.tabla-partidas input {
  width: 100%;
  padding: 6px 7px;
  font-size: 0.9rem;
}

.cabecera-vale th {
  background: var(--vale-cabecera);
  color: var(--vale-cabecera-texto);
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.02em;
}

.cabecera-vale th.col-descripcion {
  background: var(--vale-descripcion);
}

.col-descripcion {
  min-width: 130px;
}

.tabla-partidas .descripcion {
  display: block;
  padding-top: 6px;
  font-size: 0.86rem;
  font-weight: 600;
  overflow-wrap: anywhere;
}

.combo {
  position: relative;
}

.combo input {
  width: 100%;
}

.combo .resultados {
  min-width: 340px;
  right: auto;
}

.combo-codigo {
  width: 92px;
}

.celda-clave {
  min-width: 160px;
}

.pastillas {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 4px;
}

.pastilla {
  display: inline-flex;
  align-items: center;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--neutro-suave);
  color: var(--texto-suave);
  font-size: 0.74rem;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}

.pastilla-ok {
  background: var(--ok-suave);
  color: var(--ok);
}

.pastilla-alerta {
  background: var(--alerta-suave);
  color: var(--alerta);
}

.pastilla-error {
  background: var(--error-suave);
  color: var(--error);
}

.pastilla-info {
  background: var(--primario-suave);
  color: var(--primario);
}

.pastilla-lugar {
  background: var(--neutro-suave);
  color: var(--texto);
}

.resultados li .pastilla {
  margin-left: 2px;
}

.opcion-principal {
  font-weight: 600;
}

.pastilla-conteo {
  display: inline-block;
  min-width: 22px;
  margin-left: 8px;
  padding: 0 7px;
  border-radius: 999px;
  background: var(--texto-suave);
  color: var(--superficie);
  font-size: 0.78rem;
  font-weight: 700;
  text-align: center;
}

.pestana.activa .pastilla-conteo {
  background: var(--primario);
}

.boton-quitar {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 9px;
  border: 1px solid var(--error);
  border-radius: 6px;
  background: transparent;
  color: var(--error);
  font: inherit;
  font-size: 0.8rem;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
}

.boton-quitar:hover,
.boton-quitar:focus-visible {
  background: var(--error);
  color: var(--sobre-intenso);
}

.solo-lector {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.busqueda-rapida {
  margin-bottom: 10px;
}

.busqueda-rapida input {
  padding: 9px 12px;
  font-size: 0.95rem;
}

.vale-partidas .pie-editor {
  margin-top: 12px;
}

.tarjeta-inicio-vales {
  max-width: 720px;
}

.opciones-radio {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.opciones-radio label {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  cursor: pointer;
}

.opciones-radio label:has(input:checked) {
  border-color: var(--primario);
  background: var(--primario-suave);
}

.opciones-radio input {
  margin-top: 4px;
}

.filtros-historial {
  align-items: flex-end;
}

/* El buscador ocupa su propia línea y los filtros caben juntos debajo. */
.filtros-historial .buscador {
  flex: 1 1 100%;
}

.filtro {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--texto-suave);
}

.filtro input,
.filtro select,
.filtro .lista,
.filtro .combo {
  min-width: 140px;
  max-width: 210px;
  font-size: 0.9rem;
  font-weight: 400;
  color: var(--texto);
}

.lista-filtro {
  min-width: 210px;
}

.lista-usuario {
  min-width: 220px;
}

.lista-usuario .lista-boton {
  min-height: 34px;
  padding: 5px 10px;
  font-size: 0.85rem;
}

.tabla-partidas .entrada-cantidad,
.tabla-partidas .entrada-um,
.tabla-partidas .entrada-oc,
.tabla-partidas .entrada-lote,
.tabla-partidas .combo-codigo {
  width: 100% !important;
}

.tabla-partidas .celda-clave {
  min-width: 0;
}

.tabla-partidas .boton-quitar {
  padding: 5px 7px;
}

/* ---------------------------------------------------------------- listas desplegables propias */

.lista {
  position: relative;
  min-width: 0;
}

.lista-boton {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  width: 100%;
  min-height: 38px;
  padding: 7px 10px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  background: var(--superficie);
  color: var(--texto);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.lista-boton:hover {
  border-color: var(--primario);
}

.lista-boton:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 2px;
}

.lista-boton[aria-expanded="true"] {
  border-color: var(--primario);
}

.lista-boton[disabled] {
  opacity: 0.55;
  cursor: not-allowed;
}

.lista-valor {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lista-vacia {
  color: var(--texto-suave);
}

.lista-flecha {
  color: var(--texto-suave);
  font-size: 0.9rem;
}

.lista .resultados {
  min-width: 100%;
  right: auto;
}

.resultados li.elegida {
  font-weight: 700;
}

.resultados li.elegida::before {
  content: "✓ ";
  color: var(--primario);
}

.con-error .lista-boton,
.lista.con-error .lista-boton {
  border-color: var(--error);
  box-shadow: 0 0 0 1px var(--error);
}

/* ---------------------------------------------------------------- fotos del vale (NOV) */

.fotos-vale {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
  align-items: start;
}

.foto-espacio {
  position: relative;
  overflow: hidden;
  border: 1px dashed var(--borde);
  border-radius: 6px;
  background: var(--superficie-2);
}

.foto-espacio img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.foto-acciones {
  position: absolute;
  inset: 3px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  justify-content: space-between;
  pointer-events: none;
}

.foto-acciones > * {
  pointer-events: auto;
}

.foto-acciones .boton {
  align-self: center;
}

.foto-acciones .boton,
.foto-acciones .boton-quitar {
  padding: 2px 6px;
  font-size: 0.72rem;
  background: var(--superficie);
}

.foto-agregar {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  min-height: 60px;
  color: var(--primario);
  font-size: 0.8rem;
  font-weight: 700;
  text-align: center;
  cursor: pointer;
}

.foto-agregar:hover {
  background: var(--primario-suave);
}

.fotos-detalle {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}

.fotos-detalle figure {
  margin: 0;
}

.fotos-detalle img {
  display: block;
  max-width: 260px;
  max-height: 220px;
  border-radius: 6px;
  border: 1px solid var(--borde);
}

.fotos-detalle figcaption {
  color: var(--texto-suave);
  font-size: 0.8rem;
}

.enlace-boton {
  border: 0;
  padding: 0;
  background: none;
  color: var(--primario);
  font: inherit;
  font-weight: 600;
  text-decoration: underline;
  cursor: pointer;
}

.motivo textarea {
  width: 100%;
  font: inherit;
  font-size: 0.9rem;
  border: 1px solid var(--borde);
  border-radius: 6px;
  padding: 7px 10px;
  background: var(--superficie);
  color: var(--texto);
  resize: vertical;
}

/* ---------------------------------------------------------------- columna principal del vale */

.vale-principal {
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-width: 0;
}

.vale-pie .pie-editor {
  margin-top: 0;
  padding-top: 0;
  border-top: 0;
}

.vale-pie .motivo + .aviso,
.vale-pie .motivo + .acciones-linea {
  margin-top: 12px;
}

.vale-fotos .fotos-vale {
  max-width: 640px;
  gap: 10px;
}

.datos-automaticos {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 4px;
  padding-top: 10px;
  border-top: 1px dashed var(--borde);
}

.subtitulo-panel {
  color: var(--texto-suave);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

/* "Presentación" cuando cabe; si no, "U.M." (quien usa el formato sabe que es lo mismo). */
.vale-partidas {
  container-type: inline-size;
}

.si-hay-espacio {
  display: none;
}

@container (min-width: 900px) {
  .si-hay-espacio {
    display: inline;
  }

  .si-no-hay-espacio {
    display: none;
  }

  .tabla-partidas .c-um {
    width: 112px;
  }
}

/* ---------------------------------------------------------------- preferencias de cada almacenista */

.bloque-vale {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.editor-vale.partidas-izquierda {
  grid-template-columns: minmax(0, 1fr) 300px;
}

.editor-vale.partidas-izquierda > .vale-datos {
  order: 2;
}

@media (max-width: 1250px) {
  .editor-vale {
    grid-template-columns: 260px minmax(0, 1fr);
  }

  .editor-vale.partidas-izquierda {
    grid-template-columns: minmax(0, 1fr) 260px;
  }
}

@media (max-width: 1100px) {
  .editor-vale,
  .editor-vale.partidas-izquierda {
    grid-template-columns: minmax(0, 1fr);
  }
}

.previa-vale {
  display: grid;
  grid-template-columns: minmax(300px, 420px) minmax(220px, 1fr);
  gap: 12px;
  max-width: 1000px;
  padding: 12px;
  border: 1px dashed var(--borde);
  border-radius: var(--radio);
  background: var(--fondo);
}

.previa-vale.partidas-izquierda {
  grid-template-columns: minmax(220px, 1fr) minmax(300px, 420px);
}

/* Si no cabe de lado a lado (ventana angosta), las partidas van abajo. */
@container (max-width: 620px) {
  .previa-vale,
  .previa-vale.partidas-izquierda {
    grid-template-columns: minmax(0, 1fr);
  }

  .previa-vale.partidas-izquierda > .previa-datos {
    order: 0;
  }
}

.previa-vale.partidas-izquierda > .previa-datos {
  order: 2;
}

.previa-datos,
.previa-partidas {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
}

.previa-bloques {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.previa-bloque {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 6px 6px 10px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  background: var(--superficie-2);
  cursor: grab;
  user-select: none;
}

.previa-bloque:hover {
  border-color: var(--primario);
}

.previa-bloque:active {
  cursor: grabbing;
}

.previa-bloque.soltar-antes::before,
.previa-bloque.soltar-despues::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  height: 3px;
  border-radius: 2px;
  background: var(--primario);
}

.previa-bloque.soltar-antes::before {
  top: -5px;
}

.previa-bloque.soltar-despues::after {
  bottom: -5px;
}

/* Seis puntitos (2 × 3) dibujados con CSS: no dependen de la fuente de Windows. */
.asa-arrastre {
  flex: none;
  width: 10px;
  height: 16px;
  color: var(--texto-suave);
  background-image: radial-gradient(circle, currentColor 1.3px, transparent 1.7px);
  background-size: 5px 5.33px;
}

.previa-bloque:hover .asa-arrastre {
  color: var(--primario);
}

.previa-texto {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
  line-height: 1.25;
}

.previa-texto small {
  color: var(--texto-suave);
  font-size: 0.78rem;
}

.previa-mover {
  display: flex;
  flex: none;
}

.previa-mover .boton {
  padding: 2px 7px;
}

.previa-mover .boton:disabled {
  opacity: 0.3;
  cursor: default;
}

.previa-renglones,
.previa-fotos {
  display: grid;
  gap: 6px;
}

.previa-renglones span {
  height: 18px;
  border-radius: 4px;
  background: var(--superficie-2);
  border: 1px solid var(--borde);
}

.previa-fotos {
  grid-template-columns: repeat(3, 1fr);
}

.previa-fotos span {
  height: 44px;
  border-radius: 4px;
  border: 1px dashed var(--borde);
}

.previa-boton {
  align-self: flex-end;
  margin-top: auto;
  padding: 5px 12px;
  border-radius: 6px;
  background: var(--primario);
  color: var(--sobre-primario);
  font-size: 0.82rem;
  opacity: 0.75;
}

@media (max-width: 700px) {
  .previa-vale,
  .previa-vale.partidas-izquierda {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------------------------------------------------------------- fase 3: entradas, conteos y reacomodos */

.tabla-partidas .c-destino {
  width: 250px;
}

.casilla {
  display: inline-flex;
  align-items: flex-start;
  gap: 8px;
  cursor: pointer;
}

.casilla input {
  margin-top: 3px;
}

.aviso-folio {
  padding: 8px 10px;
  border: 1px solid var(--alerta, #b7791f);
  border-radius: 6px;
  font-size: 0.85rem;
}

.acciones-linea.sin-margen {
  margin: 0;
  flex-wrap: nowrap;
}

.acciones-linea.sin-margen input {
  flex: 1;
  min-width: 0;
}

.casillas-contenedores {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 6px 16px;
  margin: 12px 0;
}

.pastillas-resumen {
  margin-top: 8px;
}

.tabla-conteo .entrada-cantidad {
  width: 90px;
  text-align: right;
}

.fila-diferencia td {
  background: var(--alerta-suave, #fff7e6);
}

.pestanas-vista {
  margin-bottom: 14px;
}

.filtro-ancho {
  flex: 1 1 260px;
}

.boton-mover {
  padding: 2px 6px;
  font-size: 0.82rem;
}

.toast-accion {
  flex: none;
  white-space: nowrap;
  align-self: center;
}

/* ---------------------------------------------------------------- captura con asistente de IA */

.captura-ia {
  margin: 0 0 14px;
  border: 1px dashed var(--primario);
  border-radius: var(--radio);
  background: var(--primario-suave);
}

.captura-ia > summary {
  cursor: pointer;
  padding: 10px 14px;
  font-weight: 600;
  color: var(--primario);
}

.captura-ia-cuerpo {
  padding: 0 16px 12px;
}

.pasos-ia {
  display: grid;
  gap: 10px;
  margin: 0 0 8px;
  padding: 0;
  list-style: none;
}

.paso-ia {
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.paso-ia > div {
  flex: 1;
  min-width: 0;
}

.paso-ia p {
  margin: 2px 0 0;
}

.paso-ia .paso-numero {
  flex: none;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--primario);
  color: var(--sobre-primario);
  font-weight: 700;
  font-size: 0.9rem;
}

.pasos-grandes .pasos-ia {
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 14px;
}

.pasos-grandes .paso-ia {
  flex-direction: column;
  padding: 16px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.pasos-grandes .paso-ia:last-child {
  border-color: var(--primario);
  box-shadow: 0 0 0 3px var(--primario-suave);
}

.pasos-grandes .paso-ia > div {
  width: 100%;
}

.pasos-ia .acciones-linea {
  margin: 8px 0 0;
}

.ver-instrucciones {
  margin-top: 6px;
}

.ver-instrucciones summary {
  cursor: pointer;
  color: var(--primario);
  font-size: 0.85rem;
}

.ver-instrucciones pre {
  max-height: 220px;
  overflow: auto;
  padding: 8px;
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: 6px;
  font-size: 0.75rem;
  white-space: pre-wrap;
}

.pegar-ia {
  width: 100%;
  margin-top: 8px;
  font-family: var(--mono);
  font-size: 0.8rem;
  resize: vertical;
}

.reporte-ia {
  margin: 8px 0;
  padding-left: 18px;
}

.reporte-ia li + li {
  margin-top: 2px;
}

.privacidad-ia {
  margin: 6px 0 0;
}

.captura-asistida {
  padding: 18px;
  border: 1px solid var(--borde);
  border-radius: calc(var(--radio) + 4px);
  background: linear-gradient(180deg, var(--primario-suave), var(--superficie) 140px);
}

.captura-asistida > header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}

.captura-asistida > header > div {
  flex: 1;
}

.captura-asistida h2 {
  margin: 0;
}

.captura-asistida header p {
  margin: 2px 0 0;
}

.reporte-ia-banner {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
  padding: 4px 8px 4px 12px;
  border: 1px solid var(--borde);
  border-left: 4px solid var(--ok);
  border-radius: var(--radio);
  background: var(--superficie);
}

.reporte-ia-banner .reporte-ia {
  flex: 1;
}

@media (max-width: 900px) {
  .pasos-grandes .pasos-ia {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------------------------------------------------------------- menú "Ajustes y más" */

.nav-mas {
  position: relative;
  border-top: 1px solid var(--borde);
  padding-top: 10px;
}

.nav-boton-mas {
  width: 100%;
}

.nav-boton-mas:hover,
.nav-boton-mas.activo {
  background: var(--superficie-2);
}

.nav-boton-mas.activo .icono {
  color: var(--primario);
}

.logo-mini {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border-radius: 8px;
  background: var(--inventario);
  color: var(--sobre-inventario);
}

.menu-texto {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
  line-height: 1.25;
}

.menu-texto strong {
  font-weight: 600;
}

.menu-texto small {
  color: var(--texto-suave);
  font-size: 0.78rem;
}

/* Vista "Ajustes y más": en primer plano, secciones | contenido (casi toda la pantalla). */
.ventana.ventana-mas {
  width: min(1440px, 100%);
  height: min(94vh, 1100px);
  max-height: none;
}

.ventana-mas .ventana-cuerpo {
  display: flex;
  padding: 0;
  overflow: hidden;
}

.mas-cabeza {
  display: flex;
  flex: 1;
  align-items: center;
  gap: 10px;
}

.mas-cabeza > span:last-child {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}

.mas-cabeza small {
  color: var(--texto-suave);
  font-size: 0.8rem;
}

.mas-cuerpo {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  flex: 1;
  min-height: 0;
}

.mas-secciones {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 12px 10px;
  overflow: auto;
  border-right: 1px solid var(--borde);
  background: var(--superficie-2);
}

.mas-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  color: var(--texto);
  text-decoration: none;
  transition: background var(--dur-corta) ease;
}

.mas-item .icono {
  flex: none;
  color: var(--texto-suave);
}

.mas-item:hover {
  background: var(--neutro-suave);
}

.mas-item.activo {
  background: var(--primario-suave);
  color: var(--primario);
}

.mas-item.activo .icono {
  color: var(--primario);
}

.mas-contenido {
  min-width: 0;
  overflow: auto;
  container-type: inline-size;
  padding: 20px 26px 32px;
  animation: aparecer var(--dur-media) ease-out;
}

.mas-contenido-cabeza {
  margin-bottom: 14px;
}

.mas-contenido-cabeza h2 {
  margin: 0;
  font-size: 1.4rem;
}

.mas-contenido-cabeza p {
  margin: 2px 0 0;
}

@media (max-width: 760px) {
  .ventana-fondo {
    padding: 0;
  }

  .ventana.ventana-mas {
    height: 100vh;
    border-radius: 0;
  }

  .mas-cuerpo {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
  }

  .mas-secciones {
    flex-direction: row;
    overflow-x: auto;
    border-right: 0;
    border-bottom: 1px solid var(--borde);
  }

  .mas-item small {
    display: none;
  }

  .mas-contenido {
    padding: 16px;
  }
}

/* ---------------------------------------------------------------- inicio y reporte tipo bento */

.saludo {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  margin: -6px 0 16px;
}

.saludo h2 {
  margin: 0;
  font-size: 1.45rem;
}

.saludo .nota {
  margin: 2px 0 0;
}

.alertas-inicio {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip-alerta {
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--alerta-suave);
  color: var(--alerta);
  font-size: 0.85rem;
  font-weight: 600;
}

.chip-alerta a {
  color: inherit;
}

.bento {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
}

.bento-celda {
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
  padding: 16px 18px;
  border: 1px solid var(--borde);
  border-radius: 14px;
  background: var(--superficie);
  box-shadow: var(--sombra);
  transition: background var(--dur-media) ease, border-color var(--dur-media) ease, box-shadow var(--dur-media) ease, transform var(--dur-media) ease;
}

/* Hover discreto en el inicio: un tinte del color principal. */
.bento-inicio .bento-celda:hover {
  background: color-mix(in srgb, var(--primario-suave) 55%, var(--superficie));
  border-color: color-mix(in srgb, var(--primario) 30%, var(--borde));
}

.bento-doble {
  grid-column: span 2;
}

.bento-ancha {
  grid-column: span 3;
  grid-row: span 2;
}

.bento-completa {
  grid-column: 1 / -1;
}

.bento-cabeza {
  display: flex;
  align-items: center;
  gap: 8px;
}

.bento-cabeza h2 {
  flex: 1;
  margin: 0;
  font-size: 1rem;
}

.cabeza-icono {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--primario-suave);
  color: var(--primario);
}

.bento-accion {
  position: relative;
  padding: 0;
  overflow: hidden;
}

.bento-accion:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.12);
}

.accion-enlace {
  display: flex;
  flex: 1;
  flex-direction: column;
  gap: 4px;
  padding: 18px;
  color: var(--texto);
  text-decoration: none;
}

.accion-enlace strong {
  font-size: 1.1rem;
}

.accion-enlace small {
  color: var(--texto-suave);
}

.accion-icono {
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  margin-bottom: 8px;
  border-radius: 12px;
  background: var(--primario-suave);
  color: var(--primario);
}

.accion-principal {
  border-color: var(--primario);
  background: var(--primario);
}

/* Hover de "Crear un vale": el mismo azul, un tono más oscuro (no el tinte claro de las demás). */
.bento-inicio .bento-celda.accion-principal:hover {
  border-color: var(--primario-hover);
  background: var(--primario-hover);
}

.bento-inicio .bento-celda.accion-en-curso:hover {
  border-color: var(--alerta);
  background: color-mix(in srgb, var(--alerta-suave) 60%, var(--superficie));
}

.accion-principal .accion-enlace,
.accion-principal .accion-enlace small {
  color: var(--sobre-primario);
}

.accion-principal .accion-icono {
  background: color-mix(in srgb, var(--sobre-primario) 18%, transparent);
  color: var(--sobre-primario);
}

.accion-en-curso {
  border-color: var(--alerta);
}

.accion-en-curso .accion-icono {
  background: var(--alerta-suave);
  color: var(--alerta);
}

.dato-etapa {
  overflow-wrap: anywhere;
}

.etapa-editar input {
  width: 100%;
  font-size: 1.1rem;
  font-weight: 600;
}

.etapa-editar .acciones-linea {
  margin: 6px 0 0;
}

.bento-etapa .enlace-boton {
  align-self: flex-start;
}

.dato-grande {
  margin: 0;
  font-size: 1.7rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.dato-grande small {
  font-size: 0.9rem;
  font-weight: 500;
  color: var(--texto-suave);
}

.enlace-flecha {
  margin-top: auto;
  font-size: 0.88rem;
}

.pasos-columnas {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 6px 24px;
  margin: 0;
}

.sharepoint-compacto {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.sharepoint-compacto .acciones-linea {
  margin: 0;
}

.sharepoint-compacto .nota {
  margin: 0;
}

.folios-pendientes {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.chip-folio {
  padding: 3px 10px;
  border-radius: 999px;
  background: var(--alerta-suave);
  color: var(--alerta);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  text-decoration: none;
}

.chip-folio.chip-corregido {
  background: var(--primario-suave);
  color: var(--primario);
}

.barra-fecha {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.fecha-grande {
  display: flex;
  flex-direction: column;
}

.fecha-grande input {
  font-size: 1.05rem;
  font-weight: 600;
}

.corte-aviso {
  display: flex;
  gap: 12px;
  align-items: flex-start;
  background: var(--primario-suave);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 12px 14px;
  margin-bottom: 14px;
}

.corte-aviso p {
  margin: 2px 0 0;
}

.corte-icono {
  color: var(--primario);
  flex: none;
  margin-top: 2px;
}

.archivos-dia {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
  margin-bottom: 8px;
}

.archivo-boton {
  display: flex;
  align-items: center;
  gap: 12px;
  text-align: left;
  font: inherit;
  color: var(--texto);
  background: var(--superficie-2);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  padding: 14px;
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.15s, box-shadow 0.15s;
}

.archivo-boton:hover:not(:disabled) {
  border-color: var(--primario);
  background: var(--primario-suave);
  transform: translateY(-1px);
  box-shadow: var(--sombra);
}

.archivo-boton:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.archivo-icono {
  flex: none;
  display: grid;
  place-items: center;
  width: 46px;
  height: 54px;
  border-radius: 6px;
  background: var(--ok-suave);
  color: var(--ok);
  font-weight: 700;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
}

.archivo-texto {
  display: flex;
  flex-direction: column;
  min-width: 0;
  flex: 1;
}

.archivo-nombre {
  font-family: var(--mono);
  font-size: 0.78rem;
  color: var(--texto-suave);
  overflow-wrap: anywhere;
}

/* "Descargar" visible como botón dentro de la tarjeta (no solo una flecha). */
.archivo-accion {
  flex: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  border-radius: 8px;
  background: var(--primario);
  color: var(--sobre-primario);
  font-weight: 600;
  transition: background var(--dur-corta) ease;
}

.archivo-boton:hover:not(:disabled) .archivo-accion {
  background: var(--primario-hover);
}

.archivo-boton:disabled .archivo-accion {
  background: var(--neutro-suave);
  color: var(--texto-suave);
}

.archivo-boton.descargado {
  border-color: var(--ok);
}

.archivo-boton.descargado .archivo-accion {
  background: var(--superficie);
  color: var(--primario);
  box-shadow: inset 0 0 0 1px var(--primario);
}

.archivo-boton.descargado:hover .archivo-accion {
  background: var(--primario);
  color: var(--sobre-primario);
}

.archivo-listo {
  margin-top: 4px;
  color: var(--ok);
  font-size: 0.82rem;
  font-weight: 600;
  overflow-wrap: anywhere;
}

@media (max-width: 1100px) {
  .bento {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .bento-ancha {
    grid-column: 1 / -1;
    grid-row: auto;
  }
}

@media (max-width: 640px) {
  .bento {
    grid-template-columns: minmax(0, 1fr);
  }

  .bento-doble {
    grid-column: auto;
  }
}

/* ---------------------------------------------------------------- ventana en primer plano */

body.con-ventana {
  overflow: hidden;
}

.ventana-fondo {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: grid;
  place-items: center;
  padding: 16px;
  background: rgba(10, 16, 24, 0.45);
  backdrop-filter: blur(2px);
  animation: aparecer var(--dur-media) ease-out;
}

.ventana {
  display: flex;
  flex-direction: column;
  width: min(720px, 100%);
  max-height: min(86vh, 900px);
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: 14px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
  outline: none;
  animation: subir var(--dur-media) cubic-bezier(0.2, 0.8, 0.2, 1);
}

.ventana-cabeza {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--borde);
}

.ventana-cabeza h2 {
  flex: 1;
  margin: 0;
  font-size: 1.1rem;
}

.ventana-cerrar {
  flex: none;
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--texto-suave);
  font-size: 1rem;
  cursor: pointer;
}

.ventana-cerrar:hover {
  background: var(--superficie-2);
  color: var(--texto);
}

.ventana-cuerpo {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 16px 18px 20px;
}

.ventana-cuerpo > p:first-child {
  margin-top: 0;
}

/* ---------------------------------------------------------------- vales de entrada (ronda 6) */

.elegir-modo {
  max-width: 760px;
  margin: 24px auto 12px;
  text-align: center;
}

.elegir-modo h2 {
  margin: 0 0 4px;
  font-size: 1.35rem;
}

.modos {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
  margin: 20px 0;
}

.modo-tarjeta {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  padding: 28px 22px;
  font: inherit;
  color: var(--texto);
  text-align: center;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: 14px;
  box-shadow: var(--sombra);
  cursor: pointer;
  transition: transform var(--dur-corta) ease, box-shadow var(--dur-corta) ease, border-color var(--dur-corta) ease, background var(--dur-corta) ease;
}

.modo-tarjeta strong {
  font-size: 1.15rem;
}

.modo-tarjeta small {
  color: var(--texto-suave);
}

.modo-tarjeta:hover,
.modo-tarjeta:focus-visible {
  border-color: var(--primario);
  background: var(--primario-suave);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(16, 24, 40, 0.12);
}

.modo-destacado {
  border-color: var(--primario);
}

.modo-icono {
  display: grid;
  place-items: center;
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: var(--primario-suave);
  color: var(--primario);
}

.captura-asistida .modo-icono {
  width: 46px;
  height: 46px;
  border-radius: 12px;
  background: var(--superficie);
}

.modo-devolucion {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 14px;
  border: 1px dashed var(--borde);
  border-radius: var(--radio);
  color: var(--texto-suave);
  font-size: 0.9rem;
}

.modo-devolucion input {
  width: 130px;
}

.acciones-linea.centrado {
  justify-content: center;
}

.barra-entrada {
  position: sticky;
  top: 57px;
  z-index: 15;
  margin: 0 0 14px;
  padding: 10px 14px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  box-shadow: 0 4px 14px rgba(16, 24, 40, 0.08);
}

.barra-entrada-fila {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.barra-entrada-estado {
  flex: 1;
  min-width: 0;
}

.barra-entrada-acciones {
  flex: none;
}

.barra-entrada-estado,
.barra-entrada-acciones {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.barra-entrada-acciones .boton {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.chip-estado {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border: 1px solid var(--borde);
  border-radius: 999px;
  background: var(--neutro-suave);
  font: inherit;
  font-size: 0.82rem;
  color: var(--texto);
}

.chip-alerta {
  background: var(--alerta-suave);
  border-color: transparent;
  color: var(--alerta);
}

.chip-error {
  background: var(--error-suave);
  border-color: transparent;
  color: var(--error);
  cursor: pointer;
}

.chip-ok {
  background: var(--ok-suave);
  border-color: transparent;
  color: var(--ok);
}

.barra-errores {
  margin: 10px 0 2px;
  padding: 8px 12px 8px 28px;
  border-radius: 6px;
  background: var(--error-suave);
  max-height: 40vh;
  overflow: auto;
  animation: aparecer var(--dur-corta) ease-out;
}

.barra-errores .enlace-boton {
  color: var(--error);
  text-align: left;
}

.entrada-encabezado {
  padding: 14px 16px;
  margin-bottom: 14px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.encabezado-campos {
  display: grid;
  grid-template-columns: minmax(130px, 0.8fr) minmax(200px, 1.4fr) minmax(150px, 0.8fr) minmax(200px, 1.4fr);
  gap: 10px 14px;
}

.encabezado-campos .campo {
  margin: 0;
  min-width: 0;
}

.encabezado-campos input {
  width: 100%;
}

.entrada-encabezado .aviso-folio {
  margin-top: 10px;
}

.encabezado-pie {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 16px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--borde);
  font-size: 0.85rem;
  color: var(--texto-suave);
}

.campo-observaciones {
  flex: 1 1 320px;
  margin: 0;
  flex-direction: row;
  align-items: center;
  gap: 8px;
}

.campo-observaciones input {
  flex: 1;
}

.entrada-partidas {
  padding: 14px 16px;
  background: var(--superficie);
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.entrada-partidas .partidas-cabeza {
  margin-bottom: 8px;
}

/* Columnas de la primera línea de cada partida: # · código · descripción · clave · cantidad · UM · quitar */
.partidas-titulos,
.partida-linea1 {
  display: grid;
  grid-template-columns: 34px minmax(100px, 0.8fr) minmax(150px, 1.8fr) minmax(140px, 1.3fr) minmax(100px, 0.9fr) 86px 70px 34px;
  gap: 8px;
  align-items: center;
}

.partidas-titulos {
  padding: 0 10px 4px;
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--texto-suave);
}

.lista-partidas {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
}

.partida-entrada {
  padding: 8px 10px;
  border: 1px solid var(--borde);
  border-left: 4px solid var(--primario-suave);
  border-radius: var(--radio);
  background: var(--superficie);
  transition: border-color var(--dur-corta) ease, box-shadow var(--dur-corta) ease;
  animation: aparecer var(--dur-media) ease-out;
}

.partida-entrada:focus-within {
  border-left-color: var(--primario);
  box-shadow: 0 2px 10px rgba(16, 24, 40, 0.08);
}

.partida-entrada.dudosa {
  border-left-color: var(--alerta);
  background: color-mix(in srgb, var(--alerta-suave) 45%, var(--superficie));
}

.partida-entrada.con-error {
  border-left-color: var(--error);
}

.partida-vacia {
  border-style: dashed;
  border-left-width: 1px;
  background: var(--superficie-2);
}

.partida-num {
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--neutro-suave);
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

.pf {
  min-width: 0;
}

.pf input,
.pf .combo,
.pf .combo input {
  width: 100%;
}

.pf .descripcion {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  font-size: 0.9rem;
  line-height: 1.25;
}

.pf-cant input {
  text-align: right;
}

.mini {
  display: none;
  font-size: 0.72rem;
  font-weight: 600;
  text-transform: uppercase;
  color: var(--texto-suave);
}

.partida-linea2 {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 18px;
  margin: 6px 0 0 42px;
  padding-top: 6px;
  border-top: 1px solid var(--borde);
}

.mini-linea {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--texto-suave);
}

.pf-entra,
.pf-solicita,
.pf-oc,
.pf-revisar {
  display: flex;
  align-items: center;
  gap: 6px;
}

.pf-solicita .combo,
.pf-solicita input {
  width: 210px;
}

.pf-oc input {
  width: 110px;
}

.lista-entra .lista-boton {
  min-width: 150px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--primario-suave);
  border-color: transparent;
  color: var(--primario);
  font-size: 0.85rem;
}

.lista-entra.sin-elegir .lista-boton {
  background: var(--superficie-2);
  border: 1px dashed var(--borde);
  color: var(--texto-suave);
}

.lista-entra.con-error .lista-boton {
  border: 1px solid var(--error);
  background: var(--error-suave);
  color: var(--error);
}

.lista-entra .lista-boton:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.lista-entra .resultados {
  min-width: 340px;
}

.entra-valor {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  flex: 1;
}

.indicador {
  display: inline-flex;
  align-items: baseline;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 999px;
  background: var(--neutro-suave);
  font-size: 0.82rem;
  color: var(--texto-suave);
  white-space: nowrap;
}

.indicador strong {
  color: var(--texto);
}

.indicador-ok {
  background: var(--ok-suave);
  color: var(--ok);
}

.indicador-info {
  background: var(--primario-suave);
  color: var(--primario);
}

.indicador-alerta {
  background: var(--alerta-suave);
  color: var(--alerta);
}

.indicador-error {
  background: var(--error-suave);
  color: var(--error);
}

.partida-sugerencia {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin: 6px 0 0 42px;
  font-size: 0.85rem;
  color: var(--alerta);
}

.chip-sugerencia {
  display: inline-flex;
  align-items: baseline;
  gap: 6px;
  padding: 2px 10px;
  border: 1px solid var(--alerta);
  border-radius: 999px;
  background: var(--alerta-suave);
  color: var(--texto);
  font: inherit;
  font-size: 0.82rem;
  cursor: pointer;
}

.chip-sugerencia small {
  color: var(--texto-suave);
}

/* En las tarjetas de entrada el botón es solo la ✕ (en los vales de salida dice "✕ Quitar"). */
.partida-entrada .boton-quitar {
  display: inline-grid;
  place-items: center;
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--texto-suave);
  cursor: pointer;
}

.partida-entrada .boton-quitar:hover {
  background: var(--error-suave);
  color: var(--error);
}

.ventana.ventana-copilot {
  width: min(820px, 100%);
}

@media (max-width: 1100px) {
  .encabezado-campos {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .partidas-titulos {
    display: none;
  }

  .partida-linea1 {
    grid-template-columns: 34px repeat(3, minmax(0, 1fr)) 30px;
    grid-template-areas:
      "num cod  cla  cla  quitar"
      ".   desc desc desc ."
      ".   np   cant um   .";
    align-items: end;
  }

  .partida-linea1 .partida-num {
    grid-area: num;
    align-self: center;
  }

  .partida-linea1 .pf-codigo {
    grid-area: cod;
  }

  .partida-linea1 .pf-desc {
    grid-area: desc;
  }

  .partida-linea1 .pf-clave {
    grid-area: cla;
  }

  .partida-linea1 .pf-np {
    grid-area: np;
  }

  .partida-linea1 .pf-cant {
    grid-area: cant;
  }

  .partida-linea1 .pf-um {
    grid-area: um;
  }

  .partida-linea1 .pf-quitar {
    grid-area: quitar;
    align-self: center;
  }

  .mini {
    display: block;
  }

  .partida-linea2 {
    margin-left: 0;
  }

  .modos {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 1250px) {
  .barra-entrada-estado .nota {
    display: none;
  }
}

@media (max-width: 900px) {
  .barra-entrada-fila {
    flex-wrap: wrap;
  }
}

@media (max-width: 640px) {
  .encabezado-campos {
    grid-template-columns: minmax(0, 1fr);
  }

  .barra-entrada {
    top: 0;
  }
}

/* ---------------------------------------------------------------- animaciones */

@keyframes aparecer {
  from {
    opacity: 0;
  }
}

@keyframes subir {
  from {
    opacity: 0;
    transform: translateY(12px) scale(0.98);
  }
}

@keyframes desplegar {
  from {
    opacity: 0;
    transform: translateY(-4px) scaleY(0.97);
  }
}

@keyframes toast-arriba {
  from {
    opacity: 0;
    transform: translateY(-14px);
  }
}

@keyframes toast-abajo {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
}

:root[data-avisos="abajo"] .toast,
body:has(.barra-entrada) .toast,
body.con-ventana .toast {
  animation-name: toast-abajo;
}

/* Cada página aparece suave al entrar. */
.contenido {
  animation: aparecer var(--dur-media) ease-out;
}

.tarjeta,
.bento-celda {
  animation: subir var(--dur-media) ease-out backwards;
}

.bento-celda:nth-child(2) {
  animation-delay: 30ms;
}

.bento-celda:nth-child(3) {
  animation-delay: 60ms;
}

.bento-celda:nth-child(4) {
  animation-delay: 90ms;
}

.bento-celda:nth-child(n + 5) {
  animation-delay: 120ms;
}

/* Sin animaciones: por elección o porque Windows pide reducir el movimiento. */
:root[data-animaciones="no"] *,
:root[data-animaciones="no"] *::before,
:root[data-animaciones="no"] *::after {
  animation: none !important;
  transition: none !important;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0s !important;
    transition-duration: 0.01ms !important;
  }
}

/* ---------------------------------------------------------------- personalización */

.personalizacion {
  display: grid;
  gap: 12px;
  margin: 10px 0;
}

.segmentos-campo {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 16px;
}

.segmentos-etiqueta {
  width: 110px;
  font-weight: 600;
}

.segmentos {
  display: inline-flex;
  max-width: 100%;
  overflow-x: auto;
  padding: 3px;
  gap: 3px;
  border: 1px solid var(--borde);
  border-radius: 10px;
  background: var(--superficie-2);
}

.segmento {
  white-space: nowrap;
  padding: 6px 14px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--texto-suave);
  font: inherit;
  cursor: pointer;
  transition: background var(--dur-corta) ease, color var(--dur-corta) ease, box-shadow var(--dur-corta) ease;
}

.segmento:hover {
  color: var(--texto);
}

.segmento.activo {
  background: var(--superficie);
  color: var(--primario);
  font-weight: 600;
  box-shadow: var(--sombra);
}

/* ---------------------------------------------------------------- entradas: atención, NP y transiciones (ronda 8) */

.chip-filtro {
  cursor: pointer;
  transition: background var(--dur-corta) ease, box-shadow var(--dur-corta) ease;
}

.chip-filtro:hover {
  box-shadow: 0 0 0 2px color-mix(in srgb, currentColor 25%, transparent);
}

.chip-filtro.activo {
  box-shadow: 0 0 0 2px currentColor;
  font-weight: 600;
}

.chip-info {
  background: var(--primario-suave);
  border-color: transparent;
  color: var(--primario);
}

.filtro-partidas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin: 0 0 10px;
  padding: 8px 12px;
  border-radius: var(--radio);
  background: var(--primario-suave);
  animation: aparecer var(--dur-media) ease-out;
}

.partida-errores {
  margin: 6px 0 0 42px;
  padding: 0 0 0 16px;
  color: var(--error);
  font-size: 0.85rem;
}

.partida-entrada.resuelta {
  border-left-color: var(--ok);
}

.partida-resuelta {
  display: inline-block;
  margin: 6px 0 0 42px;
  color: var(--ok);
  font-size: 0.85rem;
  font-weight: 600;
}

.pf-np input:disabled {
  background: var(--superficie-2);
}

/* Al llegar lo de Copilot: las partidas entran una tras otra y lo nuevo destella un momento. */
.editor-entrada.entrando .partida-entrada {
  animation: subir 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
  animation-delay: calc(var(--i, 0) * 45ms);
}

.partida-entrada.reciente {
  animation: destello 2.4s ease-out;
}

.editor-entrada.entrando .partida-entrada.reciente {
  animation: subir 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) backwards, destello 2.4s ease-out;
  animation-delay: calc(var(--i, 0) * 45ms), calc(var(--i, 0) * 45ms);
}

@keyframes destello {
  0%,
  30% {
    background: var(--primario-suave);
    border-color: var(--primario);
  }
}

/* La guía de 3 pasos: "Listo" y luego se va suave hacia arriba. */
.captura-asistida.saliendo {
  animation: irse 0.4s ease-in 0.65s forwards;
  pointer-events: none;
}

@keyframes irse {
  to {
    opacity: 0;
    transform: translateY(-16px) scale(0.985);
  }
}

.ventana-fondo.cerrando {
  animation: desvanecer 0.3s ease-in forwards;
}

.ventana-fondo.cerrando .ventana {
  animation: bajar 0.3s ease-in forwards;
}

@keyframes desvanecer {
  to {
    opacity: 0;
  }
}

@keyframes bajar {
  to {
    opacity: 0;
    transform: translateY(14px) scale(0.98);
  }
}

.pegar-acciones {
  margin: 8px 0 0;
}

.ia-listo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  padding: 14px;
  border-radius: var(--radio);
  background: var(--ok-suave);
  animation: aparecer var(--dur-media) ease-out;
}

.ia-listo > span:nth-child(2) {
  display: flex;
  flex: 1;
  flex-direction: column;
}

.ia-listo small {
  color: var(--texto-suave);
}

.ia-check {
  display: grid;
  place-items: center;
  flex: none;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: var(--ok);
  color: var(--sobre-intenso);
  font-size: 1.2rem;
  font-weight: 700;
  animation: rebote 0.45s cubic-bezier(0.3, 1.6, 0.5, 1);
}

@keyframes rebote {
  from {
    transform: scale(0.3);
    opacity: 0;
  }
}

/* ---------------------------------------------------------------- personas repetidas */

.grupos-repetidos {
  display: grid;
  gap: 10px;
  margin: 12px 0;
  padding: 0;
  list-style: none;
}

.grupo-repetido {
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
}

.grupo-repetido .acciones-linea {
  margin: 8px 0 0;
}

.grupo-nombres {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.grupo-nombres > li {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding: 6px 10px;
  border-radius: 6px;
  transition: background var(--dur-corta) ease, opacity var(--dur-corta) ease;
}

.grupo-nombres > li.queda {
  background: var(--ok-suave);
}

.grupo-nombres > li.fuera {
  opacity: 0.55;
}

.grupo-queda {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-width: 260px;
  cursor: pointer;
}

.grupo-incluir {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
  cursor: pointer;
}

.alias-persona {
  display: block;
  color: var(--texto-suave);
  font-size: 0.8rem;
}

.seleccion-unir {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-left: auto;
}

/* ---------------------------------------------------------------- conciliación AX (F4) */

.barra-cortes {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: 10px 14px;
  margin-bottom: 14px;
}

.lista-cortes .lista-boton {
  min-width: 220px;
  font-weight: 600;
}

.folio-corte {
  display: flex;
  flex-direction: column;
  font-size: 0.8rem;
  color: var(--texto-suave);
}

.folio-corte input {
  width: 130px;
}

.bento-concilia {
  align-items: start;
  margin-bottom: 14px;
}

.medidor {
  height: 8px;
  border-radius: 999px;
  background: var(--neutro-suave);
  overflow: hidden;
}

.medidor span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--ok);
  transition: width var(--dur-media) ease;
}

.bento-exportar-ajuste .boton {
  align-self: flex-start;
}

.lista-confirmar {
  display: grid;
  gap: 8px;
  margin: 10px 0 0;
  padding: 0;
  list-style: none;
}

.lista-confirmar > li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
  animation: aparecer var(--dur-media) ease-out;
}

.lado {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
  min-width: 0;
}

.lado-etiqueta {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--texto-suave);
}

.flecha-pareja {
  color: var(--texto-suave);
  text-align: center;
}

.acciones-pareja {
  display: flex;
  align-items: center;
  gap: 6px;
}

.lista-pareja .lista-boton {
  padding: 4px 10px;
  font-size: 0.85rem;
}

.lista-pareja .resultados {
  min-width: 320px;
  right: 0;
  left: auto;
}

code.dim-ax {
  white-space: nowrap;
}

.controles-concilia {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 8px 16px;
  margin-bottom: 10px;
}

.transito {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px 6px;
}

.transito small {
  color: var(--texto-suave);
}

.lugares {
  display: inline-flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-left: 6px;
}

.descripcion-corta {
  display: inline-block;
  max-width: 220px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  vertical-align: bottom;
}

.vista-contenedores {
  display: grid;
  gap: 10px;
}

.contenedor-concilia > summary {
  cursor: pointer;
  padding: 6px 0;
}

.totales-valuada {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 24px;
  margin-bottom: 10px;
}

.bento-sin-pareja {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  margin-top: 14px;
}

.campos-importar {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px 14px;
  margin-bottom: 8px;
}

@media (max-width: 900px) {
  .lista-confirmar > li {
    grid-template-columns: minmax(0, 1fr);
  }

  .flecha-pareja {
    display: none;
  }

  .bento-sin-pareja {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ------------------------------------------------ atajos de teclado (Ronda 9) */
.teclas {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  margin-left: 6px;
  font-size: 0.72em;
  color: var(--texto-suave);
  font-weight: 500;
}
.teclas kbd {
  font-family: var(--mono);
  font-size: 1em;
  padding: 0 5px;
  border: 1px solid var(--borde);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--superficie-2);
  line-height: 1.5;
}
@media (hover: none) {
  .teclas {
    display: none;
  }
}

/* ------------------------------------------------ bento masonry (Ronda 9) */
/* Filas de 4 px: cada celda ocupa las que mide (useMasonry); el hueco vertical lo pone el cálculo. */
.bento.masonry {
  grid-auto-rows: 4px;
  row-gap: 0;
  align-items: start;
}

.bento.masonry > * {
  align-self: start;
}

/* ------------------------------------------------ conciliación en bento (Ronda 9) */
.bento-concilia {
  margin-bottom: 14px;
}

/* Mosaico: toda la celda es un botón que abre su sección en una ventana. */
button.mosaico {
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

button.mosaico:hover {
  border-color: color-mix(in srgb, var(--primario) 35%, var(--borde));
  background: color-mix(in srgb, var(--primario-suave) 45%, var(--superficie));
  transform: translateY(-1px);
}

button.mosaico:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 2px;
}

.mosaico-titulo {
  flex: 1;
  font-weight: 650;
}

.mosaico-abrir {
  font-size: 0.8rem;
  color: var(--primario);
  opacity: 0.7;
  transition: opacity var(--dur-corta) ease, transform var(--dur-corta) ease;
}

button.mosaico:hover .mosaico-abrir {
  opacity: 1;
  transform: translateX(2px);
}

.mosaico .nota {
  display: block;
}

.mosaico-ok .dato-grande {
  color: var(--ok);
}

.mosaico-info .dato-grande {
  color: var(--primario);
}

.mosaico-alerta .dato-grande {
  color: var(--alerta);
}

.mosaico-error .dato-grande {
  color: var(--error);
}

.mosaico-atencion {
  border-color: color-mix(in srgb, var(--alerta) 45%, var(--borde));
  background: color-mix(in srgb, var(--alerta-suave) 60%, var(--superficie));
}

.mosaico-atencion .dato-grande {
  color: var(--alerta);
}

/* Vista general de la conciliación (Ronda 13): todo el reporte de AX. */
.conteo-vista {
  margin: 0 0 8px;
}

.resultado-confirmar {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

/* Archivo de vales de la base (Ronda 12). */
.mosaico-base-vacio {
  align-items: flex-start;
}

.mosaico-base-vacio .nota {
  margin: 0;
}

/* En una columna angosta del bento, el botón de importar se acomoda en dos líneas en vez de salirse. */
.mosaico-base-vacio .boton {
  max-width: 100%;
  white-space: normal;
  text-align: left;
}

.archivo-base {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--borde);
}

.archivo-base > .nota {
  flex: 1 1 320px;
}

.ax-estado {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.ax-aviso {
  color: var(--alerta);
  font-weight: 700;
  cursor: help;
}

.resumen-ax {
  display: grid;
  gap: 6px;
  margin: 12px 0;
  padding: 0;
  list-style: none;
}

.resumen-ax li {
  display: flex;
  align-items: center;
  gap: 8px;
}

.resumen-ax .pastilla {
  min-width: 3.2em;
  justify-content: center;
}

/* Partida que repite otra del mismo vale (el formulario de Excel guardó el vale dos veces). */
.fila-duplicada td {
