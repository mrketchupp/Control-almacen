  background: var(--superficie-2);
  line-height: 1.5;
}
@media (hover: none) {
  .teclas {
    display: none;
  }
}

/* ------------------------------------------------ bento masonry (Ronda 9) */
/* Filas de 4 px: cada celda ocupa las que mide (useMasonry); el hueco vertical lo pone el cálculo. */
.bento.masonry {
  grid-auto-rows: 4px;
  row-gap: 0;
  align-items: start;
}

.bento.masonry > * {
  align-self: start;
}

/* ------------------------------------------------ conciliación en bento (Ronda 9) */
.bento-concilia {
  margin-bottom: 14px;
}

/* Mosaico: toda la celda es un botón que abre su sección en una ventana. */
button.mosaico {
  font: inherit;
  color: inherit;
  text-align: left;
  cursor: pointer;
}

button.mosaico:hover {
  border-color: color-mix(in srgb, var(--primario) 35%, var(--borde));
  background: color-mix(in srgb, var(--primario-suave) 45%, var(--superficie));
  transform: translateY(-1px);
}

button.mosaico:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 2px;
}

.mosaico-titulo {
  flex: 1;
  font-weight: 650;
}

.mosaico-abrir {
  font-size: 0.8rem;
  color: var(--primario);
  opacity: 0.7;
  transition: opacity var(--dur-corta) ease, transform var(--dur-corta) ease;
}

button.mosaico:hover .mosaico-abrir {
  opacity: 1;
  transform: translateX(2px);
}

.mosaico .nota {
  display: block;
}

.mosaico-ok .dato-grande {
  color: var(--ok);
}

.mosaico-info .dato-grande {
  color: var(--primario);
}

.mosaico-alerta .dato-grande {
  color: var(--alerta);
}

.mosaico-error .dato-grande {
  color: var(--error);
}

.mosaico-atencion {
  border-color: color-mix(in srgb, var(--alerta) 45%, var(--borde));
  background: color-mix(in srgb, var(--alerta-suave) 60%, var(--superficie));
}

.mosaico-atencion .dato-grande {
  color: var(--alerta);
}

/* Vista general de la conciliación (Ronda 13): todo el reporte de AX. */
.conteo-vista {
  margin: 0 0 8px;
}

.resultado-confirmar {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

/* Archivo de vales de la base (Ronda 12). */
.mosaico-base-vacio {
  align-items: flex-start;
}

.mosaico-base-vacio .nota {
  margin: 0;
}

/* En una columna angosta del bento, el botón de importar se acomoda en dos líneas en vez de salirse. */
.mosaico-base-vacio .boton {
  max-width: 100%;
  white-space: normal;
  text-align: left;
}

.archivo-base {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--borde);
}

.archivo-base > .nota {
  flex: 1 1 320px;
}

.ax-estado {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
}

.ax-aviso {
  color: var(--alerta);
  font-weight: 700;
  cursor: help;
}

.resumen-ax {
  display: grid;
  gap: 6px;
  margin: 12px 0;
  padding: 0;
  list-style: none;
}

.resumen-ax li {
  display: flex;
  align-items: center;
  gap: 8px;
}

.resumen-ax .pastilla {
  min-width: 3.2em;
  justify-content: center;
}

/* Partida que repite otra del mismo vale (el formulario de Excel guardó el vale dos veces). */
.fila-duplicada td {
  background: color-mix(in srgb, var(--alerta-suave) 55%, transparent);
}

.fila-duplicada td:first-child {
  box-shadow: inset 3px 0 0 var(--alerta);
}

.mosaico-lista {
  display: grid;
  gap: 4px;
  margin-top: 4px;
  font-size: 0.88rem;
}

.mosaico-item {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mosaico .medidor {
  display: block;
}

.leyenda-colores {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 0.85rem;
}

.leyenda-colores li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.muestra-color {
  width: 14px;
  height: 14px;
  border: 1px solid rgba(0, 0, 0, 0.15);
  border-radius: 3px;
}

/* Ventana de una sección de la conciliación: amplia, con su buscador arriba. */
.ventana.ventana-concilia {
  width: min(1320px, 100%);
  height: min(92vh, 1000px);
  max-height: none;
}

.ventana-concilia .controles-concilia {
  position: sticky;
  top: -16px;
  z-index: 2;
  align-items: center;
  margin: 0 -18px 12px;
  padding: 12px 18px;
  background: var(--superficie);
  border-bottom: 1px solid var(--borde);
}

.ventana-concilia .ventana-cuerpo > .controles-concilia:first-child {
  margin-top: -16px;
}

.ventana-concilia .buscador {
  min-width: min(320px, 100%);
}

/* Columnas iguales en todas las partidas (la de acciones con ancho fijo), para leerlas alineadas. */
.lista-confirmar > li.item-confirmar {
  grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1.2fr) minmax(0, 400px);
}

.item-confirmar .acciones-pareja {
  flex-wrap: wrap;
  justify-content: flex-end;
}

.item-editor {
  grid-column: 1 / -1;
}

.quedara {
  flex-basis: 100%;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

.quedara code,
.clave-nueva {
  color: var(--ok);
  font-weight: 600;
}

/* Editor de dimensión y NP (conciliación e inventario). */
.editor-clave {
  display: grid;
  gap: 8px;
  padding: 12px 14px;
  border: 1px dashed color-mix(in srgb, var(--primario) 40%, var(--borde));
  border-radius: var(--radio);
  background: var(--superficie);
}

.clave-antes-despues {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  margin: 0;
}

.campos-clave {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px 14px;
}

.avisos-clave {
  display: grid;
  gap: 2px;
  margin: 0;
  padding-left: 18px;
  font-size: 0.86rem;
}

.avisos-clave .info {
  color: var(--primario);
}

.avisos-clave .alerta {
  color: var(--alerta);
}

.lista-sin-ax {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.lista-sin-ax > li {
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
}

.fila-sin-ax {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}

.fila-sin-ax .descripcion-corta {
  flex: 1;
  min-width: 160px;
}

@media (max-width: 900px) {
  .lista-confirmar > li.item-confirmar {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Accesos del inicio parejos aunque su texto mida distinto. */
.bento.masonry .bento-accion {
  min-height: 172px;
}

.acciones-fila {
  display: inline-flex;
  gap: 2px;
  white-space: nowrap;
}

/* La solicitud de ajuste es lo que se entrega: va primero y destacada. */
.bento-exportar-ajuste {
  border-color: color-mix(in srgb, var(--primario) 45%, var(--borde));
  background: color-mix(in srgb, var(--primario-suave) 40%, var(--superficie));
}

.ajuste-cuerpo {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 10px 18px;
}

.ajuste-cuerpo .nota {
  margin: 0 0 6px;
}

.ajuste-acciones {
  display: grid;
  justify-items: start;
  gap: 8px;
}

@media (max-width: 640px) {
  .ajuste-cuerpo {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Ayuda → abrir como aplicación: el destino del acceso directo, listo para copiar. */
.destino-app {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 6px 0 4px;
}

.destino-app code {
  flex: 1 1 320px;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
  font-size: 0.85rem;
  overflow-wrap: anywhere;
  user-select: all;
}

/* ---------------------------------------------------------------- conciliación (Ronda 14) */
/* Acciones en el bento; a un lado, el resumen (solo informa). */
.concilia-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  align-items: start;
  gap: 14px;
}

.concilia-layout .bento-concilia {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (min-width: 1700px) {
  .concilia-layout .bento-concilia {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 1100px) {
  .concilia-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .concilia-resumen {
    position: static;
  }

  .concilia-resumen ul {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
}

.concilia-resumen {
  position: sticky;
  top: 12px;
  padding: 14px;
  border: 1px dashed var(--borde);
  border-radius: 12px;
  background: color-mix(in srgb, var(--neutro-suave) 45%, transparent);
}

.concilia-resumen h2 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--texto-suave);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.concilia-resumen > .nota {
  margin: 2px 0 10px;
  font-size: 0.8rem;
}

.concilia-resumen ul {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.cifra {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 0 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.cifra:hover {
  background: var(--superficie);
}

.cifra:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 1px;
}

.cifra-titulo {
  font-size: 0.86rem;
  color: var(--texto-suave);
}

.cifra-dato {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.cifra-detalle {
  grid-column: 1 / -1;
  font-size: 0.76rem;
  color: var(--texto-suave);
}

.cifra .medidor {
  grid-column: 1 / -1;
  margin-top: 4px;
}

.cifra-ok .cifra-dato {
  color: var(--ok);
}

.cifra-info .cifra-dato {
  color: var(--primario);
}

.cifra-alerta .cifra-dato {
  color: var(--alerta);
}

.cifra-error .cifra-dato {
  color: var(--error);
}

.leyenda-folios {
  margin: 6px 0 0;
}

/* Por resolver: emparejar y justificar, cada uno con su número y su botón. */
.resolver-fila {
  display: grid;
  grid-template-columns: 3.2em minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-top: 1px solid var(--borde);
}

.resolver-fila .nota {
  display: block;
}

.resolver-dato {
  font-size: 1.6rem;
  font-weight: 750;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.resolver-dato.atencion {
  color: var(--alerta);
}

.resolver-dato.error {
  color: var(--error);
}

.resolver-dato.ok {
  color: var(--ok);
}

/* Justificar faltantes. */
.lista-justificar {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.item-justificar {
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: 10px;
  background: var(--superficie);
}

.just-cabeza {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 16px;
}

.just-partida {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-width: 0;
}

.just-cifras {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  font-size: 0.86rem;
  color: var(--texto-suave);
}

.just-cifras strong {
  color: var(--texto);
}

.just-sugerencia,
.just-asignadas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 6px 10px;
  border-radius: 8px;
}

.just-sugerencia {
  background: color-mix(in srgb, var(--ok-suave) 60%, transparent);
}

.just-asignadas {
  background: color-mix(in srgb, var(--primario-suave) 60%, transparent);
}

.vale-sugerido,
.vale-asignado {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border: 1px solid var(--borde);
  border-radius: 999px;
  background: var(--superficie);
}

.enlace-boton.peligro {
  color: var(--error);
}

.controles-elegir {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}

.controles-elegir .buscador {
  flex: 1 1 260px;
}

.elegir-vales {
  display: grid;
  gap: 8px;
  padding-top: 6px;
  border-top: 1px dashed var(--borde);
}

/* Inventario (Ronda 16): explica la vista diaria, como el Excel del almacén. */
.nota-inventario-dia {
  margin: -4px 0 10px;
}

/* ---------------------------------------------------------------- vale impreso por inventario (ronda 17)
   Ajustes → logos y textos fijos del formato que cambian al imprimir (el Excel no cambia). */

.vale-impreso {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 400px);
  gap: 20px;
  align-items: start;
}

.vale-impreso-editor {
  min-width: 0;
}

.vale-impreso-editor h3:first-child {
  margin-top: 4px;
}

.reglas-texto {
  display: grid;
  gap: 8px;
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
}

.regla-texto {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: end;
}

.regla-campo {
  display: grid;
  gap: 2px;
  min-width: 0;
  color: var(--texto-suave);
  font-size: 0.78rem;
}

.regla-campo input {
  width: 100%;
  min-width: 0;
}

.regla-flecha {
  padding-bottom: 7px;
  color: var(--texto-suave);
}

.regla-veces {
  min-width: 70px;
  padding-bottom: 8px;
  color: var(--texto-suave);
  font-size: 0.78rem;
  white-space: nowrap;
}

.regla-sin {
  color: var(--alerta);
  font-weight: 600;
}

.boton-quitar-regla {
  width: 30px;
  height: 30px;
  margin-bottom: 2px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  background: transparent;
  color: var(--texto-suave);
  font: inherit;
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
}

.boton-quitar-regla:hover {
  border-color: var(--error);
  color: var(--error);
}

.sugeridos-texto {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  font-size: 0.85rem;
}

.chip-texto {
  max-width: 100%;
  padding: 2px 10px;
  overflow: hidden;
  border: 1px dashed var(--alerta);
  border-radius: 999px;
  background: var(--alerta-suave);
  color: var(--texto);
  font: inherit;
  font-size: 0.82rem;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.textos-formato {
  max-height: 280px;
  margin: 8px 0 0;
  padding: 0;
  overflow: auto;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  list-style: none;
}

.textos-formato li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--borde);
}

.textos-formato li:last-child {
  border-bottom: 0;
}

.texto-formato {
  flex: 1;
  min-width: 0;
  font-size: 0.85rem;
  overflow-wrap: anywhere;
}

.textos-formato small {
  color: var(--texto-suave);
  white-space: nowrap;
}

.logos-formato {
  display: grid;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.logo-formato {
  padding: 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.logo-par {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.logo-par figure {
  display: grid;
  gap: 4px;
  margin: 0;
}

/* Las imágenes van sobre blanco, como en el papel (también en tema oscuro). */
.logo-marco {
  display: grid;
  place-items: center;
  width: 180px;
  max-width: 100%;
  height: 70px;
  padding: 4px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  background: #fff;
  color: #5b6b7c;
  font-size: 0.8rem;
}

.logo-marco img {
  max-width: 100%;
  max-height: 60px;
  object-fit: contain;
}

.logo-vacio {
  background: repeating-linear-gradient(45deg, #fff, #fff 6px, #eef1f5 6px, #eef1f5 12px);
}

.logo-par figcaption {
  max-width: 180px;
  color: var(--texto-suave);
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}

.vale-impreso-previa {
  position: sticky;
  top: 0;
  margin: 0;
  min-width: 0;
}

.vale-impreso-previa figcaption {
  margin-bottom: 6px;
  color: var(--texto-suave);
  font-size: 0.8rem;
}

.previa-hoja {
  max-height: 560px;
  padding: 8px;
  overflow: auto;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: #fff;
}

.previa-escala {
  zoom: 0.48;
}

@media (max-width: 1100px) {
  .vale-impreso {
    grid-template-columns: minmax(0, 1fr);
  }

  .vale-impreso-previa {
    position: static;
  }
}

@container (max-width: 820px) {
  .vale-impreso {
    grid-template-columns: minmax(0, 1fr);
  }

  .vale-impreso-previa {
    position: static;
  }
}

@container (max-width: 520px) {
  .regla-texto {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .regla-flecha {
    display: none;
  }
}

.vale-impreso-previa figcaption {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}

@media (max-width: 640px) {
  .marca small {
    display: none;
  }

  .marca strong {
    white-space: nowrap;
  }
}

/* Encabezado del formato como viene en el archivo, con lo que se imprime (editable). */
.textos-archivo {
  display: grid;
  gap: 8px;
  margin: 0 0 12px;
  padding: 0;
  list-style: none;
}

.texto-archivo {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 6px 12px;
  padding: 8px 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.texto-cambiado {
  border-color: var(--inventario);
  background: var(--inventario-suave);
}

.texto-archivo-original {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 8px;
  min-width: 0;
}

.texto-archivo-original small {
  width: 100%;
  color: var(--texto-suave);
  font-size: 0.75rem;
}

.texto-original {
  font-size: 0.88rem;
  overflow-wrap: anywhere;
}

.texto-archivo-impreso {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.texto-archivo-impreso input {
  flex: 1;
  min-width: 0;
}

.barra-guardar-textos {
  margin: 12px 0 4px;
}

@container (max-width: 620px) {
  .texto-archivo {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* ---------------------------------------------------------------- etiquetas (Ronda 20) */

/* DLTA en azul y GSM en morado, sea cual sea el inventario abierto. */
.pastilla-inv-dlta {
  background: #e6eef8;
  color: #1f4e8c;
}

.pastilla-inv-gsm {
  background: #f1eafa;
  color: #6b3fa0;
}

:root[data-tema="oscuro"] .pastilla-inv-dlta {
  background: #1d3150;
  color: #6ea3e8;
}

:root[data-tema="oscuro"] .pastilla-inv-gsm {
  background: #2c2240;
  color: #b99df0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-tema="claro"]) .pastilla-inv-dlta {
    background: #1d3150;
    color: #6ea3e8;
  }

  :root:not([data-tema="claro"]) .pastilla-inv-gsm {
    background: #2c2240;
    color: #b99df0;
  }
}

.sugerencia-etiquetas {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 4px 0 12px;
  padding: 10px 14px;
  border: 1px dashed var(--ok);
  border-radius: var(--radio);
  background: var(--superficie);
}

.sugerencia-etiquetas .icono {
  flex: none;
  color: var(--ok);
}

.sugerencia-etiquetas > span {
  display: flex;
  flex: 1;
  flex-direction: column;
}

.sugerencia-etiquetas small {
  color: var(--texto-suave);
}

.etq-cabeza {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  margin-bottom: 14px;
}

.etq-cabeza .nota {
  margin: 0;
}

.etq-fuentes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.etq-fuente {
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 10px;
  align-items: center;
  padding: 12px 14px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie);
  color: var(--texto);
  font: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: var(--sombra);
  transition: border-color var(--dur-corta), background var(--dur-corta);
}

.etq-fuente:hover {
  border-color: var(--primario);
  background: var(--primario-suave);
}

.etq-fuente:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 2px;
}

.etq-fuente .icono {
  grid-row: 1 / 3;
  color: var(--primario);
}

.etq-fuente small {
  color: var(--texto-suave);
}

.etq-entradas {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.etq-entradas-fila {
  flex-direction: row;
  flex-wrap: wrap;
}

.etq-entrada {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  width: 100%;
  padding: 8px 12px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
  color: var(--texto);
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.etq-entrada:hover {
  border-color: var(--primario);
}

.etq-entrada:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 1px;
}

.etq-entradas-fila .etq-entrada {
  width: auto;
}

.etq-buscar-entrada .campo {
  margin-bottom: 10px;
}

.etq-entrada-cabeza {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}

.etq-entrada-cabeza .pastilla {
  margin-left: 8px;
}

.etq-lista {
  display: flex;
  flex-direction: column;
  margin: 0;
  padding: 0;
  list-style: none;
}

.etq-fila {
  display: grid;
  grid-template-columns: auto auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  padding: 8px 4px;
  border-bottom: 1px solid var(--borde);
}

.etq-fila:last-child {
  border-bottom: none;
}

.etq-fuera .etq-fila-texto,
.etq-fuera .etq-cantidad {
  opacity: 0.45;
}

.etq-cantidad {
  display: flex;
  align-items: center;
  gap: 4px;
}

.etq-cantidad input {
  width: 64px;
  text-align: right;
}

.etq-fila-texto {
  min-width: 0;
}

.etq-fila-texto > div:first-child {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.etq-fila-datos {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
  margin-top: 3px;
}

.etq-origen {
  font-size: 0.78rem;
}

.etq-fila-acciones {
  display: flex;
  align-items: center;
  gap: 2px;
}

.ventana.ventana-ancha {
  width: min(1100px, 100%);
}

.ventana.ventana-etiqueta {
  width: min(640px, 100%);
}

.etq-editor {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 12px 14px;
}

.etq-editor .campo-ancho {
  grid-column: 1 / -1;
}

.etq-editor .campo input,
.etq-editor .combo {
  width: 100%;
}

/* Diseño: campos a la izquierda; una etiqueta a tamaño real y la hoja a la derecha. */
.etq-diseno {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: 20px;
}

.etq-diseno-campos {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.etq-diseno-campos h3 {
  margin: 10px 0 0;
}

.etq-medidas {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px 12px;
}

.etq-medidas .casilla {
  grid-column: 1 / -1;
}

.etq-identidad {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 0;
  padding: 10px 12px 12px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.etq-identidad legend {
  padding: 0 6px;
  color: var(--texto-suave);
  font-size: 0.85rem;
}

.etq-logos {
  display: flex;
  flex-wrap: wrap;
  gap: 14px;
}

.etq-logo-campo {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.etq-logo-titulo {
  color: var(--texto-suave);
  font-size: 0.85rem;
  font-weight: 600;
}

.etq-logo-campo .logo-marco {
  width: 150px;
  height: 56px;
}

.etq-logo-campo .logo-marco img {
  max-height: 46px;
}

.etq-logos-vale {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.etq-logos-vale .logo-marco {
  width: 96px;
  height: 44px;
  cursor: pointer;
}

.etq-logos-vale .logo-marco:hover {
  border-color: var(--primario);
}

.etq-logos-vale .logo-marco img {
  max-height: 36px;
}

.etq-diseno-previa {
  position: sticky;
  top: 0;
  align-self: start;
  margin: 0;
}

.etq-diseno-previa figcaption {
  margin: 0 0 6px;
  color: var(--texto-suave);
  font-size: 0.85rem;
}

.etq-previa-sola {
  max-width: 100%;
  margin-bottom: 14px;
  overflow: auto;
}

/* Una sola etiqueta: sin el tamaño ni la sombra de la hoja. */
.etq-previa-sola .etq-sola .etq-hoja {
  width: auto;
  height: auto;
  padding: 0;
  background: none;
  box-shadow: none;
}

.etq-previa-marco {
  overflow: hidden;
  padding: 4px;
  border-radius: var(--radio);
  background: var(--neutro-suave);
}

.etq-previa-sola .etq-sola .etq-hojas {
  align-items: flex-start;
}

.etq-consejo {
  max-width: 760px;
  margin: 0 auto 12px;
  color: #e3e9f0;
  font-size: 0.85rem;
  text-align: center;
}

.etq-salieron > span {
  font-weight: 600;
}

@media (max-width: 900px) {
  .etq-diseno {
    grid-template-columns: minmax(0, 1fr);
  }

  .etq-diseno-previa {
    position: static;
  }
}

@media (max-width: 640px) {
  .etq-fila {
    grid-template-columns: auto auto minmax(0, 1fr);
  }

  .etq-fila-acciones {
    grid-column: 1 / -1;
    justify-content: flex-end;
  }

  .etq-editor,
  .etq-medidas {
    grid-template-columns: minmax(0, 1fr);
  }
}

.vista-previa.vista-etiquetas {
  background: rgba(15, 22, 32, 0.92);
}

.etq-cabeza .segmentos-etiqueta,
.ventana-etq-entrada .segmentos-etiqueta {
  white-space: nowrap;
}

/* Ronda 21: las ventanas de etiquetas (inventario y vale de entrada) ocupan casi toda la pantalla; la
   tabla toma el espacio que queda y los botones de abajo siempre están a la vista. */
.ventana.ventana-etq {
  height: min(92vh, 1000px);
  max-height: none;
}

.ventana-etq .ventana-cuerpo {
  display: flex;
  flex-direction: column;
}

.ventana-etq .ventana-cuerpo > *,
.ventana-etq .etq-buscar-entrada > * {
  flex: none;
}

.ventana-etq .tabla-contenedor {
  flex: 1 1 auto;
  min-height: 160px;
  max-height: none;
}

.ventana-etq .etq-buscar-entrada {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
}

.ventana-etq .etq-buscar-entrada .etq-entradas {
  flex: 1 1 auto;
  min-height: 120px;
  overflow: auto;
}

.ventana-etq .pie-editor {
  position: sticky;
  bottom: -20px;
  z-index: 2;
  margin-top: auto;
  margin-bottom: -20px;
  padding-top: 12px;
  padding-bottom: 16px;
  background: var(--superficie);
}

.ventana-etq .filtros,
.ventana-etq .etq-de-inventario {
  margin-bottom: 10px;
}

.etq-de-inventario {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--borde);
}

.etq-de-inventario .nota {
  margin: 0;
}

.etq-sin-datos,
.ventana-etq .etq-sin-datos {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  gap: 10px;
}

.etq-entrada .pastilla-inv {
  margin-right: -4px;
}

.etq-compartida {
  margin: -4px 0 8px;
}

/* Revisión de la Ronda 21. Una ventana nunca es más ancha que la pantalla: sin esto, en la rejilla del fondo
   la columna crecía hasta el ancho mínimo de la tabla y en pantallas angostas los botones quedaban fuera. */
.ventana-fondo {
  grid-template-columns: minmax(0, 1fr);
}

.ventana {
  min-width: 0;
}

/* Las etiquetas de los segmentos (p. ej. «Inventario en la etiqueta») miden lo que su texto. */
.ventana-etq .segmentos-etiqueta,
.etq-cabeza .segmentos-etiqueta {
  width: auto;
}

/* La lista de entradas se desplaza; el anillo de foco de cada una debe verse completo. */
.ventana-etq .etq-buscar-entrada .etq-entradas {
  padding: 3px;
}

/* ---------------------------------------------------------------- Ronda 22 — editor de diseños
   A pantalla completa: diseños a la izquierda, la etiqueta grande al centro (siempre en blanco, como sale
   impresa, aunque el tema sea oscuro) y agregar / propiedades a la derecha. En angosto, una zona a la vez
   con pestañas. La selección, las asas, la cuadrícula y las guías van sobre la etiqueta en blanco: sus
   colores son fijos (azul en DLTA, morado en GSM). */

.ventana-fondo.edd-fondo {
  padding: 0;
  background: var(--fondo);
  backdrop-filter: none;
}

.ventana.edd {
  --edd-sel: #1f5fbf;

  --edd-guia: #d6246e;
  --edd-aviso: #b45309;
  width: 100vw;
  max-width: 100vw;
  height: 100vh;
  height: 100dvh;
  max-height: none;
  overflow: hidden;
  border: 0;
  border-radius: 0;
  box-shadow: none;

:root[data-inventario="GSM"] .ventana.edd {

}

.edd-asa-ne {

.edd-asa-se {

.edd-asa-s {
