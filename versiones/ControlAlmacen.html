  background: color-mix(in srgb, var(--alerta-suave) 55%, transparent);
}

.fila-duplicada td:first-child {
  box-shadow: inset 3px 0 0 var(--alerta);
}

.mosaico-lista {
  display: grid;
  gap: 4px;
  margin-top: 4px;
  font-size: 0.88rem;
}

.mosaico-item {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.mosaico .medidor {
  display: block;
}

.leyenda-colores {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 12px;
  margin: 0;
  padding: 0;
  list-style: none;
  font-size: 0.85rem;
}

.leyenda-colores li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.muestra-color {
  width: 14px;
  height: 14px;
  border: 1px solid rgba(0, 0, 0, 0.15);
  border-radius: 3px;
}

/* Ventana de una sección de la conciliación: amplia, con su buscador arriba. */
.ventana.ventana-concilia {
  width: min(1320px, 100%);
  height: min(92vh, 1000px);
  max-height: none;
}

.ventana-concilia .controles-concilia {
  position: sticky;
  top: -16px;
  z-index: 2;
  align-items: center;
  margin: 0 -18px 12px;
  padding: 12px 18px;
  background: var(--superficie);
  border-bottom: 1px solid var(--borde);
}

.ventana-concilia .ventana-cuerpo > .controles-concilia:first-child {
  margin-top: -16px;
}

.ventana-concilia .buscador {
  min-width: min(320px, 100%);
}

/* Columnas iguales en todas las partidas (la de acciones con ancho fijo), para leerlas alineadas. */
.lista-confirmar > li.item-confirmar {
  grid-template-columns: minmax(0, 1fr) 24px minmax(0, 1.2fr) minmax(0, 400px);
}

.item-confirmar .acciones-pareja {
  flex-wrap: wrap;
  justify-content: flex-end;
}

.item-editor {
  grid-column: 1 / -1;
}

.quedara {
  flex-basis: 100%;
  font-size: 0.85rem;
  color: var(--texto-suave);
}

.quedara code,
.clave-nueva {
  color: var(--ok);
  font-weight: 600;
}

/* Editor de dimensión y NP (conciliación e inventario). */
.editor-clave {
  display: grid;
  gap: 8px;
  padding: 12px 14px;
  border: 1px dashed color-mix(in srgb, var(--primario) 40%, var(--borde));
  border-radius: var(--radio);
  background: var(--superficie);
}

.clave-antes-despues {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  margin: 0;
}

.campos-clave {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px 14px;
}

.avisos-clave {
  display: grid;
  gap: 2px;
  margin: 0;
  padding-left: 18px;
  font-size: 0.86rem;
}

.avisos-clave .info {
  color: var(--primario);
}

.avisos-clave .alerta {
  color: var(--alerta);
}

.lista-sin-ax {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.lista-sin-ax > li {
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
}

.fila-sin-ax {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
}

.fila-sin-ax .descripcion-corta {
  flex: 1;
  min-width: 160px;
}

@media (max-width: 900px) {
  .lista-confirmar > li.item-confirmar {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Accesos del inicio parejos aunque su texto mida distinto. */
.bento.masonry .bento-accion {
  min-height: 172px;
}

.acciones-fila {
  display: inline-flex;
  gap: 2px;
  white-space: nowrap;
}

/* La solicitud de ajuste es lo que se entrega: va primero y destacada. */
.bento-exportar-ajuste {
  border-color: color-mix(in srgb, var(--primario) 45%, var(--borde));
  background: color-mix(in srgb, var(--primario-suave) 40%, var(--superficie));
}

.ajuste-cuerpo {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 10px 18px;
}

.ajuste-cuerpo .nota {
  margin: 0 0 6px;
}

.ajuste-acciones {
  display: grid;
  justify-items: start;
  gap: 8px;
}

@media (max-width: 640px) {
  .ajuste-cuerpo {
    grid-template-columns: minmax(0, 1fr);
  }
}

/* Ayuda → abrir como aplicación: el destino del acceso directo, listo para copiar. */
.destino-app {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 6px 0 4px;
}

.destino-app code {
  flex: 1 1 320px;
  min-width: 0;
  padding: 8px 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: var(--superficie-2);
  font-size: 0.85rem;
  overflow-wrap: anywhere;
  user-select: all;
}

/* ---------------------------------------------------------------- conciliación (Ronda 14) */
/* Acciones en el bento; a un lado, el resumen (solo informa). */
.concilia-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 270px;
  align-items: start;
  gap: 14px;
}

.concilia-layout .bento-concilia {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

@media (min-width: 1700px) {
  .concilia-layout .bento-concilia {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}

@media (max-width: 1100px) {
  .concilia-layout {
    grid-template-columns: minmax(0, 1fr);
  }

  .concilia-resumen {
    position: static;
  }

  .concilia-resumen ul {
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
}

.concilia-resumen {
  position: sticky;
  top: 12px;
  padding: 14px;
  border: 1px dashed var(--borde);
  border-radius: 12px;
  background: color-mix(in srgb, var(--neutro-suave) 45%, transparent);
}

.concilia-resumen h2 {
  margin: 0;
  font-size: 0.95rem;
  color: var(--texto-suave);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.concilia-resumen > .nota {
  margin: 2px 0 10px;
  font-size: 0.8rem;
}

.concilia-resumen ul {
  display: grid;
  gap: 4px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.cifra {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 0 8px;
  width: 100%;
  padding: 6px 8px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.cifra:hover {
  background: var(--superficie);
}

.cifra:focus-visible {
  outline: 2px solid var(--primario);
  outline-offset: 1px;
}

.cifra-titulo {
  font-size: 0.86rem;
  color: var(--texto-suave);
}

.cifra-dato {
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

.cifra-detalle {
  grid-column: 1 / -1;
  font-size: 0.76rem;
  color: var(--texto-suave);
}

.cifra .medidor {
  grid-column: 1 / -1;
  margin-top: 4px;
}

.cifra-ok .cifra-dato {
  color: var(--ok);
}

.cifra-info .cifra-dato {
  color: var(--primario);
}

.cifra-alerta .cifra-dato {
  color: var(--alerta);
}

.cifra-error .cifra-dato {
  color: var(--error);
}

.leyenda-folios {
  margin: 6px 0 0;
}

/* Por resolver: emparejar y justificar, cada uno con su número y su botón. */
.resolver-fila {
  display: grid;
  grid-template-columns: 3.2em minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  padding: 8px 0;
  border-top: 1px solid var(--borde);
}

.resolver-fila .nota {
  display: block;
}

.resolver-dato {
  font-size: 1.6rem;
  font-weight: 750;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.resolver-dato.atencion {
  color: var(--alerta);
}

.resolver-dato.error {
  color: var(--error);
}

.resolver-dato.ok {
  color: var(--ok);
}

/* Justificar faltantes. */
.lista-justificar {
  display: grid;
  gap: 8px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.item-justificar {
  display: grid;
  gap: 8px;
  padding: 10px 12px;
  border: 1px solid var(--borde);
  border-radius: 10px;
  background: var(--superficie);
}

.just-cabeza {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 16px;
}

.just-partida {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
  min-width: 0;
}

.just-cifras {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 12px;
  font-size: 0.86rem;
  color: var(--texto-suave);
}

.just-cifras strong {
  color: var(--texto);
}

.just-sugerencia,
.just-asignadas {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
  padding: 6px 10px;
  border-radius: 8px;
}

.just-sugerencia {
  background: color-mix(in srgb, var(--ok-suave) 60%, transparent);
}

.just-asignadas {
  background: color-mix(in srgb, var(--primario-suave) 60%, transparent);
}

.vale-sugerido,
.vale-asignado {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border: 1px solid var(--borde);
  border-radius: 999px;
  background: var(--superficie);
}

.enlace-boton.peligro {
  color: var(--error);
}

.controles-elegir {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 12px;
}

.controles-elegir .buscador {
  flex: 1 1 260px;
}

.elegir-vales {
  display: grid;
  gap: 8px;
  padding-top: 6px;
  border-top: 1px dashed var(--borde);
}

/* Inventario (Ronda 16): explica la vista diaria, como el Excel del almacén. */
.nota-inventario-dia {
  margin: -4px 0 10px;
}

/* ---------------------------------------------------------------- vale impreso por inventario (ronda 17)
   Ajustes → logos y textos fijos del formato que cambian al imprimir (el Excel no cambia). */

.vale-impreso {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(240px, 400px);
  gap: 20px;
  align-items: start;
}

.vale-impreso-editor {
  min-width: 0;
}

.vale-impreso-editor h3:first-child {
  margin-top: 4px;
}

.reglas-texto {
  display: grid;
  gap: 8px;
  margin: 0 0 10px;
  padding: 0;
  list-style: none;
}

.regla-texto {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto auto;
  gap: 8px;
  align-items: end;
}

.regla-campo {
  display: grid;
  gap: 2px;
  min-width: 0;
  color: var(--texto-suave);
  font-size: 0.78rem;
}

.regla-campo input {
  width: 100%;
  min-width: 0;
}

.regla-flecha {
  padding-bottom: 7px;
  color: var(--texto-suave);
}

.regla-veces {
  min-width: 70px;
  padding-bottom: 8px;
  color: var(--texto-suave);
  font-size: 0.78rem;
  white-space: nowrap;
}

.regla-sin {
  color: var(--alerta);
  font-weight: 600;
}

.boton-quitar-regla {
  width: 30px;
  height: 30px;
  margin-bottom: 2px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  background: transparent;
  color: var(--texto-suave);
  font: inherit;
  font-size: 1.05rem;
  line-height: 1;
  cursor: pointer;
}

.boton-quitar-regla:hover {
  border-color: var(--error);
  color: var(--error);
}

.sugeridos-texto {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 10px;
  font-size: 0.85rem;
}

.chip-texto {
  max-width: 100%;
  padding: 2px 10px;
  overflow: hidden;
  border: 1px dashed var(--alerta);
  border-radius: 999px;
  background: var(--alerta-suave);
  color: var(--texto);
  font: inherit;
  font-size: 0.82rem;
  text-overflow: ellipsis;
  white-space: nowrap;
  cursor: pointer;
}

.textos-formato {
  max-height: 280px;
  margin: 8px 0 0;
  padding: 0;
  overflow: auto;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  list-style: none;
}

.textos-formato li {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 8px;
  border-bottom: 1px solid var(--borde);
}

.textos-formato li:last-child {
  border-bottom: 0;
}

.texto-formato {
  flex: 1;
  min-width: 0;
  font-size: 0.85rem;
  overflow-wrap: anywhere;
}

.textos-formato small {
  color: var(--texto-suave);
  white-space: nowrap;
}

.logos-formato {
  display: grid;
  gap: 12px;
  margin: 0;
  padding: 0;
  list-style: none;
}

.logo-formato {
  padding: 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.logo-par {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.logo-par figure {
  display: grid;
  gap: 4px;
  margin: 0;
}

/* Las imágenes van sobre blanco, como en el papel (también en tema oscuro). */
.logo-marco {
  display: grid;
  place-items: center;
  width: 180px;
  max-width: 100%;
  height: 70px;
  padding: 4px;
  border: 1px solid var(--borde);
  border-radius: 6px;
  background: #fff;
  color: #5b6b7c;
  font-size: 0.8rem;
}

.logo-marco img {
  max-width: 100%;
  max-height: 60px;
  object-fit: contain;
}

.logo-vacio {
  background: repeating-linear-gradient(45deg, #fff, #fff 6px, #eef1f5 6px, #eef1f5 12px);
}

.logo-par figcaption {
  max-width: 180px;
  color: var(--texto-suave);
  font-size: 0.78rem;
  overflow-wrap: anywhere;
}

.vale-impreso-previa {
  position: sticky;
  top: 0;
  margin: 0;
  min-width: 0;
}

.vale-impreso-previa figcaption {
  margin-bottom: 6px;
  color: var(--texto-suave);
  font-size: 0.8rem;
}

.previa-hoja {
  max-height: 560px;
  padding: 8px;
  overflow: auto;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
  background: #fff;
}

.previa-escala {
  zoom: 0.48;
}

@media (max-width: 1100px) {
  .vale-impreso {
    grid-template-columns: minmax(0, 1fr);
  }

  .vale-impreso-previa {
    position: static;
  }
}

@container (max-width: 820px) {
  .vale-impreso {
    grid-template-columns: minmax(0, 1fr);
  }

  .vale-impreso-previa {
    position: static;
  }
}

@container (max-width: 520px) {
  .regla-texto {
    grid-template-columns: minmax(0, 1fr) auto;
  }

  .regla-flecha {
    display: none;
  }
}

.vale-impreso-previa figcaption {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 6px 10px;
}

@media (max-width: 640px) {
  .marca small {
    display: none;
  }

  .marca strong {
    white-space: nowrap;
  }
}

/* Encabezado del formato como viene en el archivo, con lo que se imprime (editable). */
.textos-archivo {
  display: grid;
  gap: 8px;
  margin: 0 0 12px;
  padding: 0;
  list-style: none;
}

.texto-archivo {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  align-items: center;
  gap: 6px 12px;
  padding: 8px 10px;
  border: 1px solid var(--borde);
  border-radius: var(--radio);
}

.texto-cambiado {
  border-color: var(--inventario);
  background: var(--inventario-suave);
}

.texto-archivo-original {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 8px;
  min-width: 0;
}

.texto-archivo-original small {
  width: 100%;
  color: var(--texto-suave);
  font-size: 0.75rem;
}

.texto-original {
  font-size: 0.88rem;
  overflow-wrap: anywhere;
}

.texto-archivo-impreso {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.texto-archivo-impreso input {
  flex: 1;
  min-width: 0;
}

.barra-guardar-textos {
  margin: 12px 0 4px;
}

@container (max-width: 620px) {
  .texto-archivo {
    grid-template-columns: minmax(0, 1fr);
  }
}
