[project]
name = "control-almacen"
version = "0.1.0"
description = "Control de almacén del RIG 91: inventario por contenedor, vales y conciliación contra AX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "nicegui>=3.0,<4",
    "pywebview>=5.0; sys_platform == 'win32'",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13,<2",
    "openpyxl>=3.1,<4",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
empaquetado = ["pyinstaller>=6.10"]

[project.scripts]
control-almacen = "control_almacen.app:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
control_almacen = ["db/migraciones/*.ini", "db/migraciones/*.py", "db/migraciones/versions/*.py", "ui/estaticos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
