<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden">Siguiente material</label>
<input id="q" value="foco led" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0 14px; border: 2px solid #1f4e8c; border-radius: 10px; font: 500 17px Inter, sans-serif; outline: none">
</div>

</div>

<div style="padding: 8px 12px; background: #f8fafc; border-top: 1px solid #eef1f5; font-size: 12px; color: #5b6b7c">+, doble clic o Enter agrega</div>

<button type="button" style="height: 38px; padding: 0 12px; border-radius: 8px; border: 1px solid #dde3ea; background: #ffffff; font: 600 13px Inter, sans-serif; color: #1c2733; text-align: left">Traer partidas de material recibido…</button>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":768,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const fila = 'display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid #eef1f5';
    const cantOk = 'width: 54px; height: 34px; border: 1px solid #dde3ea; border-radius: 7px; padding: 0 8px; font: 700 15px Inter, sans-serif; text-align: right';
    const cantFalta = 'width: 54px; height: 34px; border: 2px solid #d08a1c; background: #fff9ef; border-radius: 7px; padding: 0 8px; font: 700 15px Inter, sans-serif; text-align: right';
    const res = [
      { clave: 'S/D', np: 'LED 20W', cont: 'C2 Inv.', exist: 4, sel: true },
      { clave: 'SIN DIMENSION', np: 'LED 50W', cont: 'C2 Inv.', exist: 3, sel: false },
      { clave: 'S/N', np: 'X100', cont: 'C2 Inv.', exist: 0, sel: false }
    ];
    const par = [
      { id: 'm1', cod: 702, desc: 'FILTROS', clave: 'P551317', lote: '', cant: '2', ok: true },
      { id: 'm2', cod: 707, desc: 'VALVULA (INVENTARIABLE-REFACCIONES)', clave: 'MARIPOSA 4"', lote: '', cant: '1', ok: true },
      { id: 'm3', cod: 704, desc: 'EMPAQUE', clave: '6" · NP FLEXITALIC', lote: 'NUEVO', cant: '1', ok: true },
      { id: 'm4', cod: 136, desc: 'SUMINISTRO DE DIESEL Y COMBUSTIBLE', clave: 'DIESEL', lote: '', cant: '200', ok: true },
      { id: 'm5', cod: 706, desc: 'SELLOS', clave: '555001', lote: '', cant: '', ok: false },
      { id: 'm6', cod: 711, desc: 'FOCO LED', clave: 'S/D · NP LED 20W', lote: '', cant: '', ok: false }
    ];
    return {
      resultados: res.map((r) => ({ ...r, aria: 'Agregar ' + r.clave + ' ' + r.np, estilo: fila + (r.sel ? '; background: #e6eef8' : '; background: #ffffff') })),
      partidas: par.map((p) => ({ ...p, idLote: p.id + 'l', titulo: p.cod + ' · ' + p.desc + ' · ' + p.clave, estiloCant: p.ok ? cantOk : cantFalta }))
    };
  }
}
</script>
